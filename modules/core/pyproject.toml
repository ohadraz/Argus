[project]
name = "argus-core"
version = "0.1.0"
requires-python = ">=3.14"

# What every module gets by depending on the kernel at all - and no more than
# that. `psycopg` and `pydantic-settings` are here because the front doors reach
# them: `core` exports `connect` and `Settings`, so `import core`
# loads both whatever the importer wanted. The four modules that hold a
# connection are also the four that import them.
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    # The API alone, which is all instrumented code ever names: a span or a
    # metric through it is a no-op until a process installs an SDK, and only
    # `telemetry` does. Light and pure Python, which is why it is a
    # dependency of the kernel rather than an extra.
    "opentelemetry-api>=1.45",
]

# The heavy three, behind the doors they live at, taken by the modules that
# actually go through them. Declared as hard dependencies they were transitive
# to all twenty: `revenue_source` and `exchange_rate_source` installed the
# Anthropic SDK to get a `UuidStr`, and nothing said otherwise because nothing
# could - a dependency is not a thing a module can decline.
#
# Enforced rather than trusted: the front-door contract in the root
# `pyproject.toml` names who may import the model provider's adapter and
# `core.mcp_transport`, so a module reaching one without the extra fails
# `guard_layering` rather than at runtime on the day that path is first walked.
[project.optional-dependencies]
# The local model that turns text into vectors. An extra because two
# corpora want one and most callers of this kernel want neither: a module
# naming a `UuidStr` should not install an ONNX runtime to do it.
embedding = ["fastembed>=0.8"]
# The model vendor's SDK, which only the provider's adapter
# (`core.llm.adapters.anthropic_adapter`) imports. `core.llm` itself - the port,
# the factory, the conversations - needs none of it, so the agents that talk
# through it do not take this; the processes whose root builds the adapter do.
llm = ["anthropic>=1.0"]
# `httpx` because the transport builds the HTTP client a session is held over
# (`mcp_transport.an_http_client_waiting`), and the SDK takes one of its own.
mcp = ["mcp>=1.29.0", "uvicorn>=0.30", "httpx>=0.28"]
# The HTTP client `core.applying` reads a failed request's error off. Its
# two dependants declare `httpx2` themselves, as the write server declares `mcp`.
http = ["httpx2"]
migrations = ["alembic>=1.20.0"]

# `test_module` resolves each module against its own dependencies alone, so a
# test helper this module's suite imports has to be declared here or it is
# simply absent on CI, however well-populated the local workspace venv is.
#
# Every extra, for the same reason: this module's own suite is the one that
# exercises what is behind every door, so a suite resolved without them fails on
# CI alone and looks like a code problem.
[dependency-groups]
dev = [
    "argus-core[embedding,http,llm,mcp,migrations]",
    "argus-argus_testkit",
    # What an instrumented call is asserted through: an SDK's in-memory
    # exporter and reader, handed to the code under test as its tracer and
    # meter. Never a runtime dependency - the kernel carries the API alone.
    "opentelemetry-sdk>=1.45",
]


[tool.uv.sources]
argus-argus_testkit = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/core"]
