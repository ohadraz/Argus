[project]
name = "argus-agent_codefix"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    # The `llm` extra because this agent reasons: it reads the repository and
    # writes a patch, which is a conversation with a model rather than a lookup.
    "argus-argus_core[llm,mcp]",
    "argus-read_mcp_client",
    "argus-write_mcp_client",
]


[dependency-groups]
dev = [
    "argus-argus_testkit",
    # The suite builds a recorded conversation with `agent_investigator`'s own
    # builder rather than a copy of it, so the module it borrows from is a
    # dependency of this module's tests. A dev group rather than a runtime
    # dependency: nothing in `src/` reaches for it, and declaring it there
    # would put an agent in the install of every caller of this one.
    "argus-agent_investigator",
]


[tool.uv.sources]
argus-argus_core = { workspace = true }
argus-read_mcp_client = { workspace = true }
argus-write_mcp_client = { workspace = true }
argus-argus_testkit = { workspace = true }
argus-agent_investigator = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/agent_codefix"]
