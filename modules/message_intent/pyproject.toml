[project]
name = "argus-message_intent"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    # Without `llm_anthropic`: the model provider's adapter, which imports the
    # vendor's SDK, is built by the process's root (`apps.intent_reader`) and
    # handed in as the port.
    "argus-core",
    "argus-incident_record",
    # The incident's timeline said in words, for one question: what a person
    # asking about it is answered from.
    "argus-narration",
    "psycopg[binary]>=3.1",
]


# `reset_schema` runs the migration chain, so this suite needs the extra the
# kernel keeps it behind, for the reason every suite with a database does.
[dependency-groups]
dev = [
    "argus-core[migrations]",
    "argus-argus_testkit",
]


[tool.uv.sources]
argus-core = { workspace = true }
argus-incident_record = { workspace = true }
argus-narration = { workspace = true }
argus-argus_testkit = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/message_intent"]
