[project]
name = "argus-mitigation"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    "argus-core",
    "argus-mcp_transport",
    "argus-write_mcp_client",
]


[dependency-groups]
dev = [
    "argus-argus_testkit",
]


[tool.uv.sources]
argus-core = { workspace = true }
argus-mcp_transport = { workspace = true }
argus-write_mcp_client = { workspace = true }
argus-argus_testkit = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/mitigation"]
