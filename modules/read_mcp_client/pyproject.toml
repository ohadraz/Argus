[project]
name = "argus-read_mcp_client"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "argus-core",
    "argus-mcp_transport",
]

[dependency-groups]
# The read server, through its root in `apps`, is a *dev* dependency, never a
# runtime one. The client talks to the server over HTTP and imports nothing
# from it - that boundary is the point of splitting them. But the client's
# integration test drives a real server process rather than a stub, so the
# package has to be installed for the test to run. `test_module` resolves each
# module's environment to its own dependencies alone, so anything the tests
# need must be declared here or it is simply absent on CI, however
# well-populated the local workspace venv is.
dev = [
    "argus-argus_testkit",
    # The server as its process starts it: its root, which builds every adapter
    # it serves through.
    "argus-apps[read_mcp]",
    # The server's database, which the suite brings up with the schema: the
    # server refuses to start without one.
    "argus-postgres[migrations]",
    # The SDK's own types package, which the suite's knock reads the version it
    # opens a session at from (`mcp_types.version`). It arrives with `mcp`, and
    # is declared because the suite imports it by name.
    "mcp-types>=2.3.0",
]

[tool.uv.sources]
argus-core = { workspace = true }
argus-mcp_transport = { workspace = true }
argus-argus_testkit = { workspace = true }
argus-apps = { workspace = true }
argus-postgres = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/read_mcp_client"]
