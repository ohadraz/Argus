[project]
name = "argus-target_service_double"
version = "0.1.0"
requires-python = ">=3.14"
# Only what the shop's own image already carries: this runs inside that image,
# beside the shop's code, and never in Argus's processes. The shop itself is
# imported by name when the stand-in starts, not declared here - a dependency on
# the demo app would make every sync and lock of this workspace need a checkout
# of it.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]


[dependency-groups]
dev = [
    "argus-argus_testkit",
]


[tool.uv.sources]
argus-argus_testkit = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/target_service_double"]
