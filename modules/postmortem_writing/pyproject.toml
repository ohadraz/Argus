[project]
name = "argus-postmortem_writing"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    "argus-core[llm]",
    "argus-narration",
]


[tool.uv.sources]
argus-core = { workspace = true }
argus-narration = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/postmortem_writing"]
