[project]
name = "argus-postmortem_writing"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    # No `llm` extra: the writer talks through the port and is handed its
    # client, so the model vendor's SDK is the worker's to install.
    "argus-core",
    "argus-narration",
]


# `test_module` resolves this module against its own declarations alone, so
# what its suite imports is named here rather than borrowed from the workspace.
[dependency-groups]
dev = [
    "argus-argus_testkit",
]


[tool.uv.sources]
argus-core = { workspace = true }
argus-narration = { workspace = true }
argus-argus_testkit = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/postmortem_writing"]
