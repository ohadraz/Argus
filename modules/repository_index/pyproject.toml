[project]
name = "argus-repository_index"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    "argus-core",
    "argus-code_host",
]


# No model and no store client: the passages are embedded through the kernel's
# `Embedder` port and written through its `VectorIndex`, and each adapter is a
# process's root's to build - `embedding_fastembed` and `vector_store_qdrant`.
# So the callers that only need to know which commit was indexed - the push
# webhook in `web_app` - install no ONNX runtime to write one string in one row.


[dependency-groups]
dev = [
    # The schema, because the component and integration tests start from an
    # empty one rather than adopting whatever the container came up with.
    "argus-core[migrations]",
    "argus-argus_testkit",
    # The store's adapter the integration tests write through, which no module
    # here imports: the catch-up loop's root (`apps.indexer`) builds it and
    # hands each pass the port.
    "argus-vector_store_qdrant",
]


[tool.uv.sources]
argus-core = { workspace = true }
argus-code_host = { workspace = true }
argus-vector_store_qdrant = { workspace = true }
argus-argus_testkit = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/repository_index"]
