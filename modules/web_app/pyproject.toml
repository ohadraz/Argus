[project]
name = "argus-web_app"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "argus-core",
    "argus-incident_record",
    "argus-narration",
    # The push webhook writes one row of the index's watermark and indexes
    # nothing, and the package installs neither a vector store nor an embedding
    # model - those adapters are the indexing roots' - so this process serves a
    # page without either.
    "argus-repository_index",
    # The ports a person's resolution, a person's words in an incident's
    # thread, an alert and a push arrive through. Their adapters are built by
    # the process's root (`apps.web`), and this package names none of them.
    "argus-oncall_source",
    "argus-chat_platform",
    "argus-alert_source",
    "argus-push_source",
    # What the postmortem says, in the words the PDF says it in, and the PDF.
    "argus-postmortem_rendering",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "markupsafe>=3.0",
    "psycopg[binary]>=3.1",
    # What reads a form's fields. The resolve control posts its note as one,
    # which is what a browser sends without a line of script to say otherwise.
    "python-multipart>=0.0.9",
]

# `reset_schema` runs the migration chain, so this suite needs the extra the
# kernel keeps it behind. Declared here rather than relied on from the
# workspace venv: `test_module` resolves each module against its own
# dependencies alone, and a suite that only passes locally is the failure that
# arrangement exists to catch.
[dependency-groups]
dev = [
    "argus-core[migrations]",
    "argus-argus_testkit",
    # What the app's spans are asserted through: an SDK's in-memory exporter.
    # Never a runtime dependency - the process's root installs the SDK.
    "opentelemetry-sdk>=1.45",
]

[tool.uv.sources]
argus-core = { workspace = true }
argus-incident_record = { workspace = true }
argus-narration = { workspace = true }
argus-repository_index = { workspace = true }
argus-oncall_source = { workspace = true }
argus-chat_platform = { workspace = true }
argus-alert_source = { workspace = true }
argus-push_source = { workspace = true }
argus-postmortem_rendering = { workspace = true }
argus-argus_testkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_app"]
