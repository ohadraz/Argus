[project]
name = "argus-argus_web"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "argus-argus_core",
    "argus-argus_incidents",
    "argus-argus_narration",
    "argus-argus_telemetry",
    # Without `[store]`, deliberately. The push webhook writes one row of the
    # index's watermark and indexes nothing, so this process installs neither
    # a vector store nor an embedding model to serve a page.
    "argus-code_index",
    # The on-call platform's port and its PagerDuty adapter. A person resolving
    # an incident there is delivered here, and only the adapter can tell a
    # person's resolution from anything else the platform sends.
    "argus-oncall_source",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "psycopg[binary]>=3.1",
    # What reads a form's fields. The resolve control posts its note as one,
    # which is what a browser sends without a line of script to say otherwise.
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

# `reset_schema` runs the migration chain, so this suite needs the extra the
# kernel keeps it behind. Declared here rather than relied on from the
# workspace venv: `test_module` resolves each module against its own
# dependencies alone, and a suite that only passes locally is the failure that
# arrangement exists to catch.
[dependency-groups]
dev = [
    "argus-argus_core[migrations]",
]

[tool.uv.sources]
argus-argus_core = { workspace = true }
argus-argus_incidents = { workspace = true }
argus-argus_narration = { workspace = true }
argus-argus_telemetry = { workspace = true }
argus-code_index = { workspace = true }
argus-oncall_source = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_web"]
