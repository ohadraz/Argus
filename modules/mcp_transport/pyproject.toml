[project]
name = "argus-mcp_transport"
version = "0.1.0"
requires-python = ">=3.14"

# The MCP SDK, and what a session is held over: `httpx` because the transport
# builds the HTTP client a session is held over (`an_http_client_waiting`), and
# the SDK takes one of its own; `uvicorn` because `TracedFastMCP` serves itself.
# The telemetry API is named because a call is traced across the boundary here.
dependencies = [
    "argus-core",
    "mcp>=1.29.0",
    "uvicorn>=0.30",
    "httpx>=0.28",
    "opentelemetry-api>=1.45",
]


[dependency-groups]
dev = [
    "argus-argus_testkit",
    # What an instrumented call is asserted through: an SDK's in-memory
    # exporter and reader, handed to the code under test as its tracer and
    # meter, and installed in the double's own process.
    "opentelemetry-sdk>=1.45",
]


[tool.uv.sources]
argus-core = { workspace = true }
argus-argus_testkit = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/mcp_transport"]
