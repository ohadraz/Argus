[project]
name = "argus-code_host"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    "argus-core",
    "httpx2",
]


[dependency-groups]
dev = [
    "argus-argus_testkit",
    "argus-code_host_double",
    # The GitHub the port's suite asks the GitHub adapter of, served in-process
    # through Starlette's `TestClient` - which is what `httpx` is here for.
    "argus-github_double",
    "httpx",
]


[tool.uv.sources]
argus-core = { workspace = true }
argus-argus_testkit = { workspace = true }
argus-code_host_double = { workspace = true }
argus-github_double = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/code_host"]
