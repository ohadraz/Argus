[project]
name = "argus-log_source"
version = "0.1.0"
requires-python = ">=3.14"

# The kernel, for the base the adapter declares its settings on, and the HTTP
# client the adapter asks the service with.
dependencies = [
    "argus-core",
    "httpx2",
]


[dependency-groups]
dev = [
    "argus-argus_testkit",
]


[tool.uv.sources]
argus-core = { workspace = true }
argus-argus_testkit = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/log_source"]
