[project]
name = "argus-push_source"
version = "0.1.0"
requires-python = ">=3.14"

# Nothing but the standard library: a push is verified with `hmac` and read
# with `json`, and what it answers in is its own.
dependencies = []


[dependency-groups]
dev = [
    "argus-argus_testkit",
]


[tool.uv.sources]
argus-argus_testkit = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/push_source"]
