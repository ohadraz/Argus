[project]
name = "argus-push_source"
version = "0.1.0"
requires-python = ">=3.14"

# The standard library, and the kernel for the one base the GitHub adapter
# declares its settings on: a push is verified with `hmac` and read with
# `json`, and what it answers in is its own.
dependencies = [
    "argus-core",
]


[dependency-groups]
dev = [
    "argus-argus_testkit",
    "argus-push_source_double",
]


[tool.uv.sources]
argus-core = { workspace = true }
argus-argus_testkit = { workspace = true }
argus-push_source_double = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/push_source"]
