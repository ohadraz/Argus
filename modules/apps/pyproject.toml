[project]
name = "argus-apps"
version = "0.1.0"
requires-python = ">=3.14"

# What the roots share: the settings each reads, and the telemetry every
# process but the schema job starts. Everything else is a process's own extra.
dependencies = [
    "argus-core",
    "argus-telemetry",
]


# One extra per process, named as `apps.<process>` is, so that installing one
# process installs what that process runs and nothing more: `argus-apps[web]`
# serves a page without LangGraph or an agent. `scripts/guard_layering.py`
# holds each root to the workspace packages its own extra names.
[project.optional-dependencies]
worker = [
    # The model provider's adapter, the tiers' transport and the embedder recall
    # searches with (`embedding_fastembed`) are all built here.
    "argus-core[llm,mcp]",
    "argus-embedding_fastembed",
    "argus-orchestrator",
    "argus-incident_record",
    "argus-incident_memory",
    "argus-vector_store_qdrant",
    "argus-investigation_agent",
    "argus-mitigation",
    "argus-codefix_agent",
    "argus-postmortem_writing",
    "argus-oncall_source",
    "argus-pay_band_source",
    "argus-revenue_source",
    "argus-exchange_rate_source",
    "argus-read_mcp_client",
    "argus-write_mcp_client",
    "psycopg-pool>=3.2",
]
web = [
    "argus-web_app",
    "argus-alert_source",
    "argus-push_source",
    "argus-oncall_source",
    "argus-chat_platform",
    "uvicorn[standard]>=0.30",
]
read_mcp = [
    "argus-read_mcp_server",
    "argus-alerting_platform",
    "argus-code_host",
    "argus-deployment_platform",
    "argus-embedding_fastembed",
    "argus-flag_provider",
    "argus-metrics_source",
    "argus-vector_store_qdrant",
]
write_mcp = [
    "argus-write_mcp_server",
    "argus-code_host",
    "argus-deployment_platform",
    "argus-flag_provider",
]
deliverer = [
    "argus-embedding_fastembed",
    "argus-incident_memory",
    "argus-vector_store_qdrant",
]
indexer = [
    "argus-repository_index",
    "argus-embedding_fastembed",
    "argus-code_host",
    "argus-vector_store_qdrant",
]
relay = [
    "argus-communication",
    "argus-chat_platform",
    "argus-incident_record",
]
intent_reader = [
    # The model provider's adapter is built here.
    "argus-core[llm]",
    "argus-message_intent",
    "argus-chat_platform",
]
schema = [
    "argus-core[migrations]",
]


[dependency-groups]
dev = [
    "argus-argus_testkit",
    # Every process, because the suite asserts what each root builds - resolved
    # here rather than relied on from an `--all-packages` venv, since
    # `test_module` resolves this module against its own declarations alone.
    "argus-apps[worker,web,read_mcp,write_mcp,deliverer,indexer,relay,intent_reader,schema]",
]


[tool.uv.sources]
argus-core = { workspace = true }
argus-telemetry = { workspace = true }
argus-orchestrator = { workspace = true }
argus-incident_record = { workspace = true }
argus-incident_memory = { workspace = true }
argus-vector_store_qdrant = { workspace = true }
argus-embedding_fastembed = { workspace = true }
argus-investigation_agent = { workspace = true }
argus-mitigation = { workspace = true }
argus-codefix_agent = { workspace = true }
argus-postmortem_writing = { workspace = true }
argus-oncall_source = { workspace = true }
argus-pay_band_source = { workspace = true }
argus-revenue_source = { workspace = true }
argus-exchange_rate_source = { workspace = true }
argus-read_mcp_client = { workspace = true }
argus-write_mcp_client = { workspace = true }
argus-web_app = { workspace = true }
argus-alert_source = { workspace = true }
argus-push_source = { workspace = true }
argus-chat_platform = { workspace = true }
argus-read_mcp_server = { workspace = true }
argus-alerting_platform = { workspace = true }
argus-code_host = { workspace = true }
argus-deployment_platform = { workspace = true }
argus-flag_provider = { workspace = true }
argus-metrics_source = { workspace = true }
argus-write_mcp_server = { workspace = true }
argus-repository_index = { workspace = true }
argus-communication = { workspace = true }
argus-message_intent = { workspace = true }
argus-argus_testkit = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/apps"]
