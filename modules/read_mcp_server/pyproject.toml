[project]
name = "argus-read_mcp_server"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "argus-core",
    "argus-telemetry",
    "argus-repository_index[store]",
    "argus-deployment_platform",
    "argus-flag_provider",
    "argus-metrics_source",
    "argus-repository_source",
    # The vector store's adapter, built in `server.py` and handed on as the port.
    "argus-vector_store_qdrant",
    "httpx2",
    "mcp>=1.29.0",
]

[dependency-groups]
dev = [
    "argus-argus_testkit",
]

[tool.uv.sources]
argus-core = { workspace = true }
argus-telemetry = { workspace = true }
argus-repository_index = { workspace = true }
argus-deployment_platform = { workspace = true }
argus-flag_provider = { workspace = true }
argus-metrics_source = { workspace = true }
argus-repository_source = { workspace = true }
argus-vector_store_qdrant = { workspace = true }
argus-argus_testkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/read_mcp_server"]
