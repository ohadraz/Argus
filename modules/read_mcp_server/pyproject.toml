[project]
name = "argus-read_mcp_server"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "argus-argus_core",
    "httpx",
    "mcp>=1.29.0",
]

[tool.uv.sources]
argus-argus_core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/read_mcp_server"]
