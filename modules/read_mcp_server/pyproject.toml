[project]
name = "argus-read_mcp_server"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "argus-argus_core",
    "argus-argus_telemetry",
    "argus-code_index[store]",
    "argus-deployment_platform",
    "argus-metrics_source",
    "argus-repository_source",
    "httpx2",
    "mcp>=1.29.0",
]

[dependency-groups]
dev = [
    "argus-argus_testkit",
]

[tool.uv.sources]
argus-argus_core = { workspace = true }
argus-argus_telemetry = { workspace = true }
argus-code_index = { workspace = true }
argus-deployment_platform = { workspace = true }
argus-metrics_source = { workspace = true }
argus-repository_source = { workspace = true }
argus-argus_testkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/read_mcp_server"]
