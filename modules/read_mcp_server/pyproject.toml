[project]
name = "argus-read_mcp_server"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "argus-core",
    "argus-postgres",
    # The alerting platform's port. Its adapter is built by the process's root
    # (`apps.read_mcp`) and handed on.
    "argus-alerting_platform",
    # The index's passages and watermark. The embedder a question is embedded
    # with is handed in as the kernel's port, built by the process's root.
    "argus-repository_index",
    "argus-deployment_platform",
    "argus-flag_provider",
    "argus-metrics_source",
    "argus-code_host",
    # The service's logs and its register, each a port. Their adapters are
    # built by the process's root (`apps.read_mcp`) and handed on.
    "argus-log_source",
    "argus-service_register",
    "mcp>=2.3.0",
    "argus-mcp_transport",
]

[dependency-groups]
dev = [
    "argus-argus_testkit",
    # The HTTP client's own responses, which the suite builds for the alerting
    # platform's adapter to read. Nothing the package ships imports it.
    "httpx2",
]

[tool.uv.sources]
argus-core = { workspace = true }
argus-postgres = { workspace = true }
argus-mcp_transport = { workspace = true }
argus-alerting_platform = { workspace = true }
argus-repository_index = { workspace = true }
argus-deployment_platform = { workspace = true }
argus-flag_provider = { workspace = true }
argus-metrics_source = { workspace = true }
argus-code_host = { workspace = true }
argus-log_source = { workspace = true }
argus-service_register = { workspace = true }
argus-argus_testkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/read_mcp_server"]
