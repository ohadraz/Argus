[project]
name = "argus-read_mcp_server"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "argus-core",
    # The alerting platform's port. Its adapter is built by the process's root
    # (`apps.read_mcp`) and handed on.
    "argus-alerting_platform",
    "argus-repository_index[store]",
    "argus-deployment_platform",
    "argus-flag_provider",
    "argus-metrics_source",
    "argus-code_host",
    "httpx2",
    "mcp>=1.29.0",
]

[dependency-groups]
dev = [
    "argus-argus_testkit",
]

[tool.uv.sources]
argus-core = { workspace = true }
argus-alerting_platform = { workspace = true }
argus-repository_index = { workspace = true }
argus-deployment_platform = { workspace = true }
argus-flag_provider = { workspace = true }
argus-metrics_source = { workspace = true }
argus-code_host = { workspace = true }
argus-argus_testkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/read_mcp_server"]
