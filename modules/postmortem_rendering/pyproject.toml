[project]
name = "argus-postmortem_rendering"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "argus-argus_core",
    "argus-argus_narration",
    "fpdf2>=2.8",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "argus-argus_testkit",
    "pypdf>=6.0",
]

[tool.uv.sources]
argus-argus_core = { workspace = true }
argus-argus_narration = { workspace = true }
argus-argus_testkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/postmortem_rendering"]
