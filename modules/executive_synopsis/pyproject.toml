[project]
name = "argus-executive_synopsis"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    # The writer's figure engine and its judge, which the synopsis is checked
    # by too - so its figures are written, and its claims judged, as the
    # write-up's are.
    "argus-core",
    "argus-postmortem_writing",
    # The bands the response is priced at, and the pricing.
    "argus-incident_cost",
    "pydantic>=2.0",
]


# `test_module` resolves this module against its own declarations alone, so
# what its suite imports is named here rather than borrowed from the workspace.
[dependency-groups]
dev = [
    "argus-argus_testkit",
]


[tool.uv.sources]
argus-core = { workspace = true }
argus-postmortem_writing = { workspace = true }
argus-argus_testkit = { workspace = true }
argus-incident_cost = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/executive_synopsis"]
