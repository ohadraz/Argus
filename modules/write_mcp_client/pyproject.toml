[project]
name = "argus-write_mcp_client"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "argus-argus_core",
]

[dependency-groups]
# `write_mcp_server` is a *dev* dependency, never a runtime one - the same
# boundary the read tier draws. The client talks to the server over HTTP and
# imports nothing from it; it is installed here only because the client's
# integration test drives a real server process rather than a stub, and
# `test_module` resolves each module against its own dependencies alone.
dev = [
    "argus-argus_testkit",
    "argus-write_mcp_server",
]

[tool.uv.sources]
argus-argus_core = { workspace = true }
argus-argus_testkit = { workspace = true }
argus-write_mcp_server = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/write_mcp_client"]
