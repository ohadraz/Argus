[project]
name = "argus-agent_postmortem"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    "argus-argus_core[llm]",
    "argus-argus_narration",
]


[tool.uv.sources]
argus-argus_core = { workspace = true }
argus-argus_narration = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/agent_postmortem"]
