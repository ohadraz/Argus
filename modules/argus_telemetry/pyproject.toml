[project]
name = "argus-argus_telemetry"
version = "0.1.0"
requires-python = ">=3.14"

# The OpenTelemetry SDK and where it sends what it collects. A module of its own
# rather than part of the kernel, because the kernel carries the API alone: an
# instrumented call there is a no-op until a process installs an SDK, and only a
# process's `main` installs one. Every other module stays free of exporters, an
# HTTP client and a batching thread it never asked for.
#
# The file exporter is OTel's own and still beta, released in lockstep with the
# SDK - an SDK upgrade waits for the matching exporter, which uv resolves.
dependencies = [
    "argus-argus_core",
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-exporter-otlp-json-file>=0.66b1",
    # The bridge from `logging` to OTel's logs. The SDK's own handler is
    # deprecated in favour of this one.
    "opentelemetry-instrumentation-logging>=0.66b1",
]

[dependency-groups]
dev = [
    "argus-argus_testkit",
]

[tool.uv.sources]
argus-argus_core = { workspace = true }
argus-argus_testkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_telemetry"]
