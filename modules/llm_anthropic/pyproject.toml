[project]
name = "argus-llm_anthropic"
version = "0.1.0"
requires-python = ">=3.14"

# The adapter, and so the one distribution that installs the model vendor's SDK.
# Taken by the processes whose root builds a model provider - the worker and the
# Intent Reader - and by nothing that only names the port, which lives in the
# kernel (`core.llm`) and installs nothing.
dependencies = [
    "argus-core",
    "anthropic>=1.0",
]


[dependency-groups]
dev = [
    "argus-argus_testkit",
    # What the suite builds the SDK's transport errors from.
    "httpx2",
]


[tool.uv.sources]
argus-core = { workspace = true }
argus-argus_testkit = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/llm_anthropic"]
