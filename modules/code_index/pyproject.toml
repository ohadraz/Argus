[project]
name = "argus-code_index"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    "argus-argus_core",
    "argus-repository_source",
]


# The store and the model, for whoever reaches them. An extra rather than a
# hard dependency, for the reason `argus_core` makes `anthropic` and `mcp`
# extras: the watermark is Postgres and the passages are Qdrant, and the two
# callers that only need to know which commit was indexed - the push webhook
# in `argus_web`, and anything else asking whether the index is current -
# would otherwise install an ONNX runtime to write one string in one row.
#
# Every caller that searches or builds declares `argus-code_index[store]`, and
# reaching `code_index.store` or `code_index.embedding` without it is a broken
# layering contract here rather than an ImportError in a live incident.
[project.optional-dependencies]
store = [
    # Pinned to the minor the server is pinned to in `docker-compose.yml` - the
    # two are released together, and a client a minor ahead of its store is a
    # mismatch nobody sees until a payload field is refused.
    "qdrant-client>=1.19,<1.20",
    # The model runs in this process. Chosen for being local, free and
    # dependent on nothing external - not for retrieval quality, which a
    # code-trained hosted model would beat. What it buys instead is that
    # indexing costs nothing, that an incident never waits on a vendor, and
    # that no double has to exist for a suite to run.
    #
    # Taken through the kernel's door rather than declared here, because the
    # model is the kernel's: long-term memory embeds with one too.
    "argus-argus_core[embedding]",
]


[dependency-groups]
dev = [
    "argus-argus_testkit",
]


[tool.uv.sources]
argus-argus_core = { workspace = true }
argus-repository_source = { workspace = true }
argus-argus_testkit = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/code_index"]
