[project]
name = "argus-investigation_agent"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    # No `llm` extra: the agent talks through the port and is handed the
    # provider, so the model vendor's SDK is the worker's to install.
    "argus-core[mcp]",
    # The read tier, and only it: the agent offers what that tier declares. The
    # flag history it also reads is the write tier's, and is bound to its seam
    # by whoever holds that tier - never by this package.
    "argus-read_mcp_client",
]


[dependency-groups]
dev = [
    "argus-argus_testkit",
]


[tool.uv.sources]
argus-core = { workspace = true }
argus-read_mcp_client = { workspace = true }
argus-argus_testkit = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/investigation_agent"]
