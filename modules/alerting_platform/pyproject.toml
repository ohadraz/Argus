[project]
name = "argus-alerting_platform"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    "argus-core",
    "httpx2",
]


[dependency-groups]
dev = [
    "argus-alerting_platform_double",
    "argus-argus_testkit",
]


[tool.uv.sources]
argus-core = { workspace = true }
argus-alerting_platform_double = { workspace = true }
argus-argus_testkit = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/alerting_platform"]
