[project]
name = "argus-agent_intent"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    "argus-argus_core[llm]",
    "argus-argus_incidents",
    "argus-argus_telemetry",
    # The chat platform's port and its Slack adapter, for one question: what
    # the platform calls the person an offer to resolve is made to.
    "argus-chat_platform",
    "psycopg[binary]>=3.1",
]


# `reset_schema` runs the migration chain, so this suite needs the extra the
# kernel keeps it behind, for the reason every suite with a database does.
[dependency-groups]
dev = [
    "argus-argus_core[migrations]",
    "argus-argus_testkit",
]


[tool.uv.sources]
argus-argus_core = { workspace = true }
argus-argus_incidents = { workspace = true }
argus-argus_telemetry = { workspace = true }
argus-argus_testkit = { workspace = true }
argus-chat_platform = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/agent_intent"]
