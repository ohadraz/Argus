[project]
name = "argus-postgres"
version = "0.1.0"
requires-python = ">=3.14"

# The driver and its pool, and so the one package that carries them for the
# kernel's sake: the modules that open or name a connection through it take
# this, and a module that only names a model or a setting installs no driver.
dependencies = [
    "argus-core",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
]

[project.optional-dependencies]
# The schema's migrations, taken at run time by the one job that applies them
# (`apps.schema`), and in their dev groups by the suites that build a schema to
# run against.
migrations = ["alembic>=1.20.0"]

# `test_module` resolves each module against its own dependencies alone, and
# this suite applies the schema it runs against.
[dependency-groups]
dev = [
    "argus-postgres[migrations]",
    "argus-argus_testkit",
]


[tool.uv.sources]
argus-core = { workspace = true }
argus-argus_testkit = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/postgres"]
