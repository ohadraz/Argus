[project]
name = "argus-orchestrator"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    # Without `llm_anthropic`: the model provider's adapter, which imports the
    # vendor's SDK, is built by the worker's root (`apps.worker`) and handed
    # to the agents as the port.
    "argus-core",
    "argus-postgres",
    "argus-mcp_transport",
    "argus-incident_record",
    # The money a postmortem is costed from, which the walk's sources build.
    "argus-incident_cost",
    "argus-narration",
    # Without the store: the walk files a record and composes the one it
    # files, and searching for one is recall's, which the worker's root builds
    # over the store and hands the walk as `RecallSimilar`.
    "argus-incident_memory",
    "argus-investigation_agent",
    "argus-mitigation",
    "argus-codefix_agent",
    "argus-postmortem_writing",
    "argus-executive_synopsis",
    # The executive synopsis's figures and resolution, worded as the
    # postmortem's page words them.
    "argus-postmortem_rendering",
    "argus-oncall_source",
    "argus-pay_band_source",
    "argus-revenue_source",
    # The walk's sources read the alert rule and the metrics over the read
    # tier.
    "argus-read_mcp_client",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "opentelemetry-api>=1.45",
    "psycopg[binary]>=3.1",
    # The checkpointer is handed a pool, and a pool is named in the signature
    # that hands it over.
    "psycopg-pool>=3.2",
    "pydantic>=2.0",
]

# `reset_schema` runs the migration chain, so this suite needs the extra the
# database keeps it behind. Declared here rather than relied on from the
# workspace venv: `test_module` resolves each module against its own
# dependencies alone, and a suite that only passes locally is the failure that
# arrangement exists to catch.
[dependency-groups]
dev = [
    "argus-postgres[migrations]",
    "argus-argus_testkit",
    # What the walk's spans and measurements are asserted through: an SDK's
    # in-memory exporter and reader. Never a runtime dependency.
    "opentelemetry-sdk>=1.45",
]

[tool.uv.sources]
argus-core = { workspace = true }
argus-postgres = { workspace = true }
argus-mcp_transport = { workspace = true }
argus-incident_memory = { workspace = true }
argus-incident_record = { workspace = true }
argus-incident_cost = { workspace = true }
argus-narration = { workspace = true }
argus-oncall_source = { workspace = true }
argus-pay_band_source = { workspace = true }
argus-revenue_source = { workspace = true }
argus-read_mcp_client = { workspace = true }
argus-argus_testkit = { workspace = true }
argus-investigation_agent = { workspace = true }
argus-mitigation = { workspace = true }
argus-codefix_agent = { workspace = true }
argus-postmortem_writing = { workspace = true }
argus-executive_synopsis = { workspace = true }
argus-postmortem_rendering = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]
