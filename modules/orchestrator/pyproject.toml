[project]
name = "argus-orchestrator"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "argus-argus_core[llm,mcp]",
    "argus-argus_incidents",
    "argus-argus_narration",
    # With the store, because the walk is what writes a record and the walk
    # is what searches for one - and unconditionally, because whether it does
    # either is read at runtime while this is resolved at install. A worker
    # with memory off still carries Qdrant and an ONNX runtime; what it does
    # not do is import them. `incident_memory`'s own extra says why the trade
    # is taken this way round.
    "argus-incident_memory[store]",
    "argus-agent_investigator",
    "argus-agent_mitigation",
    "argus-agent_codefix",
    "argus-agent_postmortem",
    "argus-oncall_source",
    "argus-responder_rate_source",
    "argus-revenue_source",
    "argus-exchange_rate_source",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.0",
]

# `reset_schema` runs the migration chain, so this suite needs the extra the
# kernel keeps it behind. Declared here rather than relied on from the
# workspace venv: `test_module` resolves each module against its own
# dependencies alone, and a suite that only passes locally is the failure that
# arrangement exists to catch.
[dependency-groups]
dev = [
    "argus-argus_core[migrations]",
    "argus-argus_testkit",
]

[tool.uv.sources]
argus-argus_core = { workspace = true }
argus-incident_memory = { workspace = true }
argus-argus_incidents = { workspace = true }
argus-argus_narration = { workspace = true }
argus-oncall_source = { workspace = true }
argus-responder_rate_source = { workspace = true }
argus-revenue_source = { workspace = true }
argus-exchange_rate_source = { workspace = true }
argus-argus_testkit = { workspace = true }
argus-agent_investigator = { workspace = true }
argus-agent_mitigation = { workspace = true }
argus-agent_codefix = { workspace = true }
argus-agent_postmortem = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]
