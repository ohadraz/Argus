[project]
name = "argus-vector_store_qdrant"
version = "0.1.0"
requires-python = ">=3.14"

# The adapter, and so the one distribution that installs the vendor's client.
# Taken by the processes that open a store - the walk's worker, the read server,
# the deliverer and the index's catch-up loop - and by nothing that only names
# the port, which lives in the kernel and installs nothing.
dependencies = [
    "argus-core",
    # Pinned to the minor the server is pinned to in `docker-compose.yml` - the
    # two are released together, and a client a minor ahead of its store is a
    # mismatch nobody sees until a payload field is refused.
    "qdrant-client>=1.19,<1.20",
]


[dependency-groups]
dev = [
    "argus-argus_testkit",
    # What the integration suite polls the store's readiness with.
    "httpx2",
]


[tool.uv.sources]
argus-core = { workspace = true }
argus-argus_testkit = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/vector_store_qdrant"]
