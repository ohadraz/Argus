[project]
name = "argus-incident_memory"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    "argus-argus_core",
    # The row a walk files its record in, which `filing` writes and reads.
    "psycopg[binary]>=3.1",
]


# The store and the model, for whoever reaches them. An extra rather than a
# hard dependency, in the shape `code_index` uses: behind it are a Qdrant
# client and an ONNX runtime, and naming a memory record is not a reason to
# install either.
#
# Unlike `code_index`'s, this extra narrows nothing that is actually installed,
# and that is worth stating rather than leaving to be discovered. `code_index`
# has a dependant that takes it bare - `argus_web` writes the watermark row and
# never searches - where the only distribution depending on this one is
# `orchestrator`, with `[store]`. It has no choice: whether memory is searched
# at all is `incident_memory_enabled`, read when the worker starts, and a
# dependency is resolved long before a process reads anything.
#
# What does pay off is the split the extra is drawn along. `records`,
# `describing`, `ordering`, `composing` and `filing` reach no store, so the
# files in `orchestrator` that import them at module scope load neither Qdrant
# nor an ONNX runtime. `recalling` reaches the store, and its importers in the
# walk import it inside the factories that run when the process opened one;
# `keeping` and `delivering` are the deliverer's, and no walk imports them. A
# walk with memory off imports nothing it will not use, even though its wheel
# contains it.
#
# Every caller that writes or searches declares `argus-incident_memory[store]`.
# The kernel's `vector_store` and `embedding` doors are open only to the modules
# that declare their extras, this one among them, so any other module reaching
# them is a broken front-door contract rather than an ImportError at the close
# of a live incident.
[project.optional-dependencies]
store = [
    # Pinned to the minor the server is pinned to in `docker-compose.yml`, and
    # to the same minor `code_index` pins: one Qdrant serves both collections,
    # and two clients a minor apart against one server is a mismatch nobody
    # sees until a payload field is refused.
    "qdrant-client>=1.19,<1.20",
    "argus-argus_core[vector_store]",
    # The same local, free, keyless embedder the repository index uses, and
    # the same one: it is the kernel's, behind the kernel's door. Chosen for
    # costing nothing and waiting on nobody rather than for retrieval quality -
    # and behind a seam, so a benchmark that blames the model can pass a
    # different one.
    "argus-argus_core[embedding]",
    # For the deliverer's `main`, which installs the SDK for its process and
    # sits on this side of the extra already: it writes the store.
    "argus-argus_telemetry",
]


[dependency-groups]
dev = [
    # The schema, because the component tests file records in a database
    # started from an empty one rather than adopting whatever the container
    # came up with.
    "argus-argus_core[migrations]",
    "argus-argus_testkit",
    # Its own store extra, for the reason `code_index` declares its: the
    # component tests write to a real Qdrant and embed with the real model,
    # which is the only way to answer whether a record written can be found.
    "argus-incident_memory[store]",
]


[tool.uv.sources]
argus-argus_core = { workspace = true }
argus-argus_telemetry = { workspace = true }
argus-argus_testkit = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/incident_memory"]
