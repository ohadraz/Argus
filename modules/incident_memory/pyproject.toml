[project]
name = "argus-incident_memory"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    "argus-core",
    # The row a walk files its record in, which `filing` writes and reads.
    "psycopg[binary]>=3.1",
]


# No model and no store client. Keeping and recall take the kernel's ports - an
# `Embedder` and a `VectorIndex` or `VectorSearch` - and their adapters
# (`embedding_fastembed`, `vector_store_qdrant`) are the roots' to build and
# install: the worker's, which builds recall, and the deliverer's. So
# `orchestrator`, which files and composes records and never searches, loads
# neither Qdrant nor an ONNX runtime by taking this package.


[dependency-groups]
dev = [
    # The schema, because the component and integration tests file records in
    # a database started from an empty one rather than adopting whatever the
    # container came up with.
    "argus-postgres[migrations]",
    "argus-argus_testkit",
    # The store's adapter the integration tests write through, which no module
    # here imports: the deliverer's root builds it and hands `keeping` the port.
    "argus-vector_store_qdrant",
    # What the conftest polls the store's readiness with - which arrived with
    # `telemetry` while the deliverer's `main` lived here.
    "httpx2",
]


[tool.uv.sources]
argus-core = { workspace = true }
argus-postgres = { workspace = true }
argus-vector_store_qdrant = { workspace = true }
argus-argus_testkit = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/incident_memory"]
