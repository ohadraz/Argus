[project]
name = "argus-service_register"
version = "0.1.0"
requires-python = ">=3.14"

# The kernel, for the type a dependency is answered in and the base the
# adapter declares its settings on, and the HTTP client the adapter asks the
# register with.
dependencies = [
    "argus-core",
    "httpx2",
]


[dependency-groups]
dev = [
    "argus-argus_testkit",
]


[tool.uv.sources]
argus-core = { workspace = true }
argus-argus_testkit = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/service_register"]
