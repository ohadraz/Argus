[project]
name = "argus-oncall_source"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    "argus-core",
    "pagerduty>=7.0",
]


[dependency-groups]
dev = [
    "argus-argus_testkit",
]


[tool.uv.sources]
argus-core = { workspace = true }
argus-argus_testkit = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/oncall_source"]
