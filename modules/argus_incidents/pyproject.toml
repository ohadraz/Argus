[project]
name = "argus-argus_incidents"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "argus-argus_core",
    "argus-agent_postmortem",
    "argus-exchange_rate_source",
    "psycopg[binary]>=3.1",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "argus-argus_testkit",
]

[tool.uv.sources]
argus-argus_core = { workspace = true }
argus-agent_postmortem = { workspace = true }
argus-exchange_rate_source = { workspace = true }
argus-argus_testkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_incidents"]
