[project]
name = "argus-chat_platform"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    "argus-argus_core",
    "slack-sdk>=3.27",
]


# The component suite posts through the real adapter to `slack_double`, served
# in-process for the length of the suite.
[dependency-groups]
dev = [
    "argus-argus_testkit",
    "argus-slack_double",
    "httpx2",
    "uvicorn[standard]>=0.30",
]


[tool.uv.sources]
argus-argus_core = { workspace = true }
argus-argus_testkit = { workspace = true }
argus-slack_double = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/chat_platform"]
