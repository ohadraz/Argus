[project]
name = "argus-http_applying"
version = "0.1.0"
requires-python = ">=3.14"

# Whether a failed HTTP request is known not to have been applied, read off the
# client's error. A package of its own rather than a door of the kernel's, so
# the kernel installs no HTTP client: taken by the two write paths that ask over
# HTTP - the deployment platform's adapter and the flag provider's - and by
# nothing else.
dependencies = [
    "httpx2",
]


[dependency-groups]
dev = [
    "argus-argus_testkit",
]


[tool.uv.sources]
argus-argus_testkit = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/http_applying"]
