[project]
name = "argus-incident_cost"
version = "0.1.0"
requires-python = ">=3.14"

# What an incident cost, in money: the ports the money is read through, the loss
# and the pricing of the response. It depends on nothing in this workspace, so
# whatever writes about the cost - the postmortem, the walk that gathers its
# sources - installs no agent to reach the arithmetic.
dependencies = [
    "pydantic>=2.0",
]


# `test_module` resolves this module against its own declarations alone, so
# what its suite imports is named here rather than borrowed from the workspace.
[dependency-groups]
dev = [
    "argus-argus_testkit",
]


[tool.uv.sources]
argus-argus_testkit = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/incident_cost"]
