[project]
name = "argus-codefix_agent"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    # Not `llm_anthropic`, though this agent reasons: it talks through the port
    # (`core.llm`), which imports no vendor, and is handed the provider by the
    # process that builds it.
    "argus-core",
    # What Argus did about an incident is said in the words its own account
    # uses, so the fix and the write-up say one action one way.
    "argus-narration",
    "argus-read_mcp_client",
    "argus-write_mcp_client",
]


[dependency-groups]
dev = [
    "argus-argus_testkit",
]


[tool.uv.sources]
argus-core = { workspace = true }
argus-narration = { workspace = true }
argus-read_mcp_client = { workspace = true }
argus-write_mcp_client = { workspace = true }
argus-argus_testkit = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/codefix_agent"]
