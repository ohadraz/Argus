[project]
name = "argus-write_mcp_server"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "argus-argus_core",
    "httpx2",
    "mcp>=1.29.0",
    # The store the cache lives in, for the one action that reaches a datastore
    # rather than a control plane. Without `hiredis`: that extra is a compiled
    # wheel, and Smart App Control on this machine has refused those before.
    "redis>=5.0",
]

[dependency-groups]
dev = [
    "argus-argus_testkit",
]

[tool.uv.sources]
argus-argus_core = { workspace = true }
argus-argus_testkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/write_mcp_server"]
