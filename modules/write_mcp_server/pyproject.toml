[project]
name = "argus-write_mcp_server"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "argus-core",
    "argus-postgres",
    # The run a change is made for, asked of its own row before the change is
    # made (`fencing`).
    "argus-incident_record",
    "argus-deployment_platform",
    "argus-flag_provider",
    "argus-code_host",
    "httpx2",
    "mcp>=2.3.0",
    "argus-mcp_transport",
    # The store the cache lives in, as a port, for the one action that reaches
    # a datastore rather than a control plane. Its adapter is built by the
    # process's root (`apps.write_mcp`) and handed on.
    "argus-cache_store",
]

[dependency-groups]
dev = [
    "argus-argus_testkit",
]

[tool.uv.sources]
argus-core = { workspace = true }
argus-postgres = { workspace = true }
argus-mcp_transport = { workspace = true }
argus-incident_record = { workspace = true }
argus-deployment_platform = { workspace = true }
argus-flag_provider = { workspace = true }
argus-code_host = { workspace = true }
argus-cache_store = { workspace = true }
argus-argus_testkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/write_mcp_server"]
