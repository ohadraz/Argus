repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit  # ruff's repo of pre-commit hook definitions
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]  # automatically fix issues where possible
  
  - repo: local
    hooks:
      - id: nox-lint
        name: mypy (via nox)
        entry: uv run python -m nox -s typecheck  # the actual command pre-commit executes
        language: system  # uses the system's Python interpreter, which is already installed on the machine
        pass_filenames: false  # no filenames - it always lints/typechecks everything.

      - id: guard-layering
        name: module layering (via nox)
        entry: uv run python -m nox -s guard_layering  # fails if a module imports across a layer it may not
        language: system
        pass_filenames: false  # no filenames - a contract is about the whole graph.

      - id: guard-e2e-boundary
        name: e2e test boundary (via nox)
        entry: uv run python -m nox -s guard_e2e_boundary  # fails if a module's tests/ contains an e2e-marked test
        language: system
        pass_filenames: false  # no filenames - it always scans modules/*/tests/ in full.

      - id: guard-module-docstrings
        name: module docstrings (via nox)
        entry: uv run python -m nox -s guard_module_docstrings  # fails if a module's prose sits below its imports, where __doc__ never sees it
        language: system
        pass_filenames: false  # no filenames - it always scans every .py in the repo.
