# Every hook runs at commit unless it says otherwise. Without this a hook with no
# `stages` runs at every stage installed, so a push ran the whole commit set a
# second time over commits it had already passed.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit  # ruff's repo of pre-commit hook definitions
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]  # automatically fix issues where possible
  
  - repo: local
    hooks:
      # The type check and the whole-repository guards, side by side: each reads
      # the repository and writes nothing, so none waits on another, and run in
      # turn they cost the sum of their times rather than the slowest one's.
      # - typecheck: mypy over modules/ and tests/
      # - guard_layering: no module imports across a layer it may not, and no cycle
      # - guard_e2e_boundary: no module's tests/ holds an e2e-marked test
      # - guard_module_docstrings: no module's prose sits below its imports
      # - guard_exports: no package's __all__ offers a name nothing outside it uses
      # - guard_written_columns: every column the schema declares is written somewhere
      - id: checks
        name: type check and guards, side by side (via nox)
        entry: uv run python scripts/run_sessions_together.py typecheck guard_layering guard_e2e_boundary guard_module_docstrings guard_exports guard_written_columns
        language: system
        pass_filenames: false  # no filenames - every one of them reads the whole repository.

      - id: guard-recordings
        name: recordings are of finished walks (via nox)
        entry: uv run python -m nox -s guard_recordings  # fails if a recording is of a walk that gave up partway
        language: system
        pass_filenames: false  # no filenames - a corpus is many files, and the question is about the set.
        files: ^(test_support/anthropic_double/recordings/|test_support/anthropic_double/src/anthropic_double/recordings\.py$|scripts/guard_recordings\.py$)  # only a commit that can change the answer

      # At push rather than at commit, alone among these. Every hook above reads
      # this repo and nothing else; this one grades recorded patches against the
      # Target Service checked out beside it, so it fails whenever that tree is
      # mid-edit - which is most of the time somebody is working on the fixture,
      # and has nothing to do with the commit being made. Push is where that
      # objection goes away: CI is about to grade the same pair, so the sibling
      # checkout has to be right anyway, and finding out here costs seconds
      # instead of a red job on a branch already pushed.
      - id: grade-fixes
        name: recorded fixes still hold up (via nox)
        entry: uv run python -m nox -s grade_fixes  # fails if a recorded patch no longer leaves the Target Service green
        language: system
        pass_filenames: false  # no filenames - it grades every corpus that proposed a fix.
        stages: [pre-push]
