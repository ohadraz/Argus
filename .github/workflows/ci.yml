name: CI

on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: lint
        run: uv run python -m nox -s lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Sync workspace
        run: uv sync --all-packages

      - name: typecheck
        run: uv run python -m nox -s typecheck

  # Whether the fixes Code-Fix proposed actually work, decided by the Target
  # Service's own tests rather than by a model or a threshold: each recorded
  # patch's tests alone must not pass, and the whole patch must leave
  # `tests/io_shop` green.
  #
  # On every push, because it costs nothing and takes seconds. Both inputs are
  # committed - the recordings here, the service in its own repository - so the
  # verdict is a property of the commit rather than of the day it ran.
  #
  # Two repositories for the reason `paid-suites.yml` needs two: the grader
  # writes each patch into the service and puts it back with git, and a runner
  # checks out only this one. A fresh checkout is also the clean tree the
  # grader refuses to run without.
  grade-fixes:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Argus

    steps:
      - name: Check out Argus
        uses: actions/checkout@v7
        with:
          path: Argus

      - name: Check out the Target Service
        uses: actions/checkout@v7
        with:
          repository: ohadraz/Argus-Demo-Target-App
          path: Argus-Demo-Target-App

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Grade the recorded fixes
        run: uv run python -m nox -s grade_fixes

  # Free and keyless: every LLM answer is replayed from a recording committed
  # to this repo, so this exercises the real adapter - prompt, schema
  # transform, response parsing - without spending a token. That is the whole
  # point of the double, and it is why this belongs on every push rather than
  # behind the manual paid workflow.
  integration:
    runs-on: ubuntu-latest

    # Runs from the Argus checkout rather than the workspace root, for the same
    # reason `e2e-replay` does - see the two-repo layout there.
    defaults:
      run:
        working-directory: Argus

    steps:
      # This suite brings up only postgres, but the compose file it asks is the
      # root one, and that file `include`s the Target Environment's. Compose
      # resolves an include before it looks at which service was named, so a
      # runner holding only this repo fails on `up postgres` - a stack error
      # that reads like a database problem and is not one.
      - name: Check out Argus
        uses: actions/checkout@v7
        with:
          path: Argus

      - name: Check out the Target Service
        uses: actions/checkout@v7
        with:
          repository: ohadraz/Argus-Demo-Target-App
          path: Argus-Demo-Target-App

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Sync workspace
        run: uv sync --all-packages

      - name: integration
        run: uv run python -m nox -s integration

  # The whole pipeline, on every push, for nothing.
  #
  # Free and keyless for the same reason `integration` is: the worker - the one
  # process that talks to a model - is started pointed at the Anthropic double,
  # so every model answer is replayed
  # from a recording committed to this repo. No secret is passed to this job,
  # and none is needed - if it ever starts failing for want of a key, something
  # has begun reaching the real API and that is the bug.
  #
  # What a green run proves: an alert reaches the webhook, the orchestrator's
  # graph drives it, all three retrieval channels answer over MCP, the Argo CD
  # adapter maps a real vendor response, the real Anthropic adapter parses a
  # real Anthropic body, and the incident lands in a terminal status. None of
  # that is covered by the other jobs, and the last e2e failure - a Target
  # Service image months stale, 404ing on an endpoint the source plainly had -
  # was invisible to every one of them.
  #
  # What it does NOT prove: that the model reaches the right conclusion. That
  # answer was decided when the recording was made. Judgement is measured by
  # `nox -s eval` in `paid-suites.yml`, over fifty samples a case.
  #
  # Unconditional rather than behind `detect-changes`: that matrix exists to
  # skip a module's unit tests when nothing in it changed, and this job's whole
  # purpose is to catch a break *between* modules - which a change confined to
  # one module is exactly when to expect.
  e2e-replay:
    runs-on: ubuntu-latest

    # One share of the suite per runner, each bringing up a stack of its own.
    # These are long walks run one after another, so the wall-clock cost is the
    # slowest share rather than the whole suite - and on a public repo a runner
    # is free.
    #
    # Two shares, not more, and the reason is one test: the refuted-mitigation
    # case waits out two verification windows and takes thirteen of the suite's
    # twenty minutes. It cannot be divided, so it is the floor however many
    # runners there are - and a third share would only take from the eleven
    # short cases beside it. Worse, it takes nothing: the shares are contiguous
    # chunks of the ordered suite balanced by recorded duration, so the long
    # case exhausts the first chunk's budget, the second takes everything after
    # it, and a third collects no test at all and fails on an empty run.
    #
    # `fail-fast: false` because a share that breaks says nothing about the
    # others, and cancelling them would hide a second, different failure behind
    # the first.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    # Every step runs from the Argus checkout, not the workspace root - see the
    # two-repo layout below. Same arrangement as `paid-suites.yml`, which needs
    # the identical stack.
    defaults:
      run:
        working-directory: Argus

    steps:
      # docker-compose builds `target-service` from `../Argus-Demo-Target-App`,
      # a sibling directory in a separate repository. A runner checks out only
      # this repo, so that path would not exist and the stack would fail before
      # running a single test.
      #
      # `actions/checkout` cannot write outside the workspace, so the sibling
      # relationship is recreated *inside* it: both repos go into
      # subdirectories, and Argus runs from its own. The compose file and the
      # local dev layout stay exactly as they are.
      - name: Check out Argus
        uses: actions/checkout@v7
        with:
          path: Argus

      - name: Check out the Target Service
        uses: actions/checkout@v7
        with:
          repository: ohadraz/Argus-Demo-Target-App
          path: Argus-Demo-Target-App

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Sync workspace
        run: uv sync --all-packages

      # The stack builds the index before it starts a service, so this job
      # loads the real embedding model too. Same cache, same key and the same
      # spelled-out path as the module matrix uses - a tilde here would be
      # expanded by the action and not by Python, and the two would cache
      # different directories.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.fastembed
          key: fastembed-${{ hashFiles('Argus/uv.lock') }}
          restore-keys: fastembed-

      - name: e2e (replayed answers, no API key)
        # Anything after `--` reaches pytest, which is how this share is
        # selected without the session knowing it is one of several.
        #
        # `both` alone, because `both` is what a deployment runs. The session is
        # parametrized by `CODE_SEARCH` and each mode is a different stack with
        # recordings of its own; the other two are the benchmark's arrangement
        # (§21) and run in the nightly, where three stacks in sequence cost an
        # hour nobody is waiting on a push for.
        run: uv run python -m nox -s "e2e_replay(mode='both')" -- --splits 2 --group ${{ matrix.shard }}
        env:
          FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed
          # The credential that reads flag history and toggles a flag. Not a
          # secret: it is a token the Target Environment's compose seeds into
          # its own Unleash, so it is a fixture value.
          # `Settings.unleash_admin_token` has no default on purpose, so a real
          # deployment cannot ship a working write token by accident - which
          # means every job running the stack has to name it. Without it the
          # history read 401s and every mitigation escalates.
          #
          # Argus's own token, belonging to the user `Argus` - not the shop's
          # admin token, which the e2e framework uses to stand in for a human.
          # With one token for both, the provider attributes every change to the
          # same author and Argus cannot tell its own change from a person's.
          UNLEASH_ADMIN_TOKEN: "*:*.argus-agent-token"

  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # needed to walk prior workflow runs in the history-fallback step below
    outputs:
      modules: ${{ steps.combine.outputs.modules }}
    steps:
      - uses: actions/checkout@v7  # clones the repo onto the runner
        with:
          fetch-depth: 0  # fetch full history for diff
      - uses: astral-sh/setup-uv@v10.0.1  # the filter step below asks noxfile.py which modules have tests
      - id: filter
        run: |
          BASE="${{ github.event.before }}"

          # if first commit/push (00...0 SHA, or empty BASE, or doesn't exist in the repo),
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null
          then
            # then set it to the empty tree SHA
            BASE=$(git hash-object -t tree /dev/null)  # empty tree: first commit / first push on a branch
          fi

          # Ask nox which modules have a test suite, rather than listing the
          # directory. `EXCLUDED_FROM_TESTS` in noxfile.py names the modules
          # that deliberately have none - test-support packages like
          # `argus_testkit` and the Anthropic double - and nox refuses to
          # parametrize a `test_module` session for them. Reading `ls modules`
          # here would put those names in the matrix and ask nox to run a
          # session that does not exist.
          all_modules=$(uv run python -c "import noxfile; print(' '.join(noxfile.MODULES))")

          changed=()
          for m in $all_modules
          do
            if git diff --name-only "$BASE" HEAD | grep -q "^modules/$m/"
            then
              changed+=("\"$m\"")
            fi
          done

          all=()
          for m in $all_modules
          do
            all+=("\"$m\"")
          done

          tests_changed=false
          if git diff --name-only "$BASE" HEAD | grep -q "^tests/"
          then
            tests_changed=true
          fi

          echo "modules=[$(IFS=,; echo "${changed[*]}")]" >> "$GITHUB_OUTPUT"
          echo "all_modules=[$(IFS=,; echo "${all[*]}")]" >> "$GITHUB_OUTPUT"
          echo "tests_changed=$tests_changed" >> "$GITHUB_OUTPUT"

      # Fallback for pushes that touch neither modules/ nor tests/ (e.g. CI config,
      # docs): walk backwards through this branch's prior *push*-triggered, completed
      # CI runs looking for the most recent one where `test` actually ran (not
      # skipped). If it passed, nothing to do. If it failed, or no such run exists
      # all the way back to the first push, we still need a green test run - run it.
      - id: history
        if: steps.filter.outputs.modules == '[]' && steps.filter.outputs.tests_changed == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const currentRunNumber = context.runNumber;

            let needsRun = true;

            outer:
            for (let page = 1; page <= 20; page++) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo,
                workflow_id: 'ci.yml',
                branch,
                event: 'push',
                status: 'completed',
                per_page: 30,
                page,
              });

              if (data.workflow_runs.length === 0) {
                // exhausted history without ever finding a completed test run
                needsRun = true;
                break;
              }

              const priorRuns = data.workflow_runs
                .filter(r => r.run_number < currentRunNumber)
                .sort((a, b) => b.run_number - a.run_number);

              for (const run of priorRuns) {
                const { data: jobsData } = await github.rest.actions.listJobsForWorkflowRun({
                  owner, repo, run_id: run.id, per_page: 100,
                });

                const testJobs = jobsData.jobs.filter(
                  j => j.name === 'test' || j.name.startsWith('test (')
                );

                if (testJobs.length === 0 || testJobs.every(j => j.conclusion === 'skipped')) {
                  continue; // this run's test job was skipped too - keep looking further back
                }

                needsRun = testJobs.some(
                  j => !['success'].includes(j.conclusion)
                );
                break outer;
              }
            }

            core.setOutput('needs_run', needsRun ? 'true' : 'false');

      - id: combine
        run: |
          changed='${{ steps.filter.outputs.modules }}'
          all='${{ steps.filter.outputs.all_modules }}'
          tests_changed='${{ steps.filter.outputs.tests_changed }}'
          needs_run='${{ steps.history.outputs.needs_run }}'

          if [ "$changed" != "[]" ]; then
            modules="$changed"          # targeted: only the modules this push touched
          elif [ "$tests_changed" = "true" ]; then
            modules="$all"              # a shared/root test changed - can't attribute it to one module
          elif [ "$needs_run" = "true" ]; then
            modules="$all"              # history-fallback says the suite isn't known-green
          else
            modules="[]"                # nothing changed and history is known-green - skip
          fi

          echo "modules=$modules" >> "$GITHUB_OUTPUT"

  test:
    needs: detect-changes  # only run if there are modules to test
    if: needs.detect-changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ${{ fromJSON(needs.detect-changes.outputs.modules) }}

    # Same two-repo arrangement as `e2e-replay`, and for a smaller-sounding
    # reason that bites just as hard: `docker-compose.yml` *includes* the Target
    # Environment's compose file from the sibling repo, and Compose parses the
    # whole file before it looks at which service was asked for. With the
    # sibling missing, `docker compose up postgres` fails on a path that has
    # nothing to do with Postgres - and three modules' suites bring Postgres up
    # for themselves (`argus_incidents`' whole suite, what is left of
    # `orchestrator`'s, and `argus_web`'s component tests), so the failure lands
    # on whichever of them a push happens to touch.
    defaults:
      run:
        working-directory: Argus

    steps:
      - name: Check out Argus
        uses: actions/checkout@v7
        with:
          path: Argus

      - name: Check out the Target Service
        uses: actions/checkout@v7
        with:
          repository: ohadraz/Argus-Demo-Target-App
          path: Argus-Demo-Target-App

      - uses: astral-sh/setup-uv@v10.0.1  # installs `uv` onto the runner

      # The embedding model is 130MB and `code_index`'s component tests load
      # the real one - they are about whether code comes back nearer a
      # description of what it does than unrelated code, which a stand-in
      # cannot answer. Downloaded on every run that touches the module, that
      # is 130MB of somebody's bandwidth to assert something the weights have
      # already settled.
      #
      # The path is pinned rather than discovered: fastembed defaults its
      # cache to a directory under the system temp, which a runner throws away
      # and `actions/cache` cannot name. `FASTEMBED_CACHE_PATH` is what moves
      # it somewhere both of them can see - written in full rather than as
      # `~/...`, because the action expands a tilde and Python does not, and a
      # cache the tests write to a directory literally named `~` is a cache
      # that never hits and never says why.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.fastembed
          key: fastembed-${{ hashFiles('Argus/uv.lock') }}
          restore-keys: fastembed-

      - name: test changed modules
        env:
          FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed
        run: uv run python -m nox -s "test_module(module='${{ matrix.module }}')"
