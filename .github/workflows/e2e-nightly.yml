name: E2E Nightly

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC every day
  workflow_dispatch:        # allows manual trigger from the Actions tab

jobs:
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Full test sweep (all modules, continue past failures)
        run: uv run nox -s test_all -- --ci

      - name: Contract tests
        run: uv run nox -s contract

      - name: End-to-end tests (full stack via docker-compose)
        run: uv run nox -s e2e
