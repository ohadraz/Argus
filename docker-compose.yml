services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argus
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus"]
      interval: 2s
      timeout: 2s
      retries: 15

  target-service:
    profiles: ["e2e"]
    build:
      # The Target Service lives in its own repo (spec §15.1), so the default
      # is the sibling working copy a developer already has checked out.
      # CI has only this repo, and clones the demo app into a subdirectory of
      # the workspace instead - `actions/checkout` cannot write above it - so
      # it overrides this. Built from source either way, never pulled: a
      # prebuilt image is how a scenario edited in that repo silently ships
      # stale to the one suite whose job is to exercise the real thing.
      context: ${TARGET_APP_CONTEXT:-../Argus-Demo-Target-App}
    ports:
      - "8080:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 2s
      timeout: 2s
      retries: 15
