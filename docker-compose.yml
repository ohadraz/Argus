# The Target Environment - the Target Service, the feature-flag provider it
# reads its flag from, and that provider's database - is defined in its own repo
# (spec §2, §15.1), because it is the environment Argus operates *on* rather
# than a part of Argus, and it has to stand up without Argus at all.
#
# `include` rather than a second `-f`: paths inside an included file resolve
# against that file's own directory, so the Target Service still builds from its
# own repo. A second `-f` would resolve them against *this* directory and look
# for its Dockerfile here. CI recreates the sibling checkout that makes the path
# resolve - see `ci.yml`.
include:
  - path: ../Argus-Demo-Target-App/docker-compose.yml

services:
  # Included services carry no profile of their own, so they would start on a
  # plain `docker compose up`. These three entries add nothing but the `e2e`
  # profile, merged onto the definitions above: the Target Environment is a
  # fixture, not something Argus depends on, and it stays out of the default up
  # exactly as it did when it was defined here.
  target-service:
    profiles: ["e2e"]

  unleash:
    profiles: ["e2e"]

  unleash-db:
    profiles: ["e2e"]

  # Seeds the credential Argus writes flags with - see the Target Environment's
  # own compose file for why it exists and why it is written through psql.
  argus-token-seed:
    profiles: ["e2e"]

  # Seeds the fallback flag into the state the shop's story says it rests in -
  # see the Target Environment's own compose file for why it goes through psql
  # rather than the provider's API.
  fallback-flag-seed:
    profiles: ["e2e"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argus
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus"]
      interval: 2s
      timeout: 2s
      retries: 15

