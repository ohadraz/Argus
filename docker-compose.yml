services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argus
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus"]
      interval: 2s
      timeout: 2s
      retries: 15

  target-service:
    build:
      context: ../Argus-Demo-Target-App
    ports:
      - "8080:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 2s
      timeout: 2s
      retries: 15
