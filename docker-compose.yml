# The Target Environment - the Target Service, the feature-flag provider it
# reads its flag from, and that provider's database - is defined in its own repo
# (spec §2, §15.1), because it is the environment Argus operates *on* rather
# than a part of Argus, and it has to stand up without Argus at all.
#
# `include` rather than a second `-f`: paths inside an included file resolve
# against that file's own directory, so the Target Service still builds from its
# own repo. A second `-f` would resolve them against *this* directory and look
# for its Dockerfile here. CI recreates the sibling checkout that makes the path
# resolve - see `ci.yml`.
include:
  - path: ../Argus-Demo-Target-App/docker-compose.yml

# Nothing here re-declares an included service. `include` does not merge: a name
# that appears both here and in the included file is a conflict, not an
# override, and Compose refuses the whole file over it - so the Target
# Environment's services are taken exactly as its own repo defines them.
#
# What starts is therefore chosen by naming it, not by profile. A suite that
# needs only the database asks for only the database
# (`docker compose up -d --wait postgres`, which is what the repository and
# component conftests do); the e2e stack asks for everything. The cost is that a
# bare `docker compose up` now starts the Target Environment too - acceptable,
# because every path that matters says what it wants.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argus
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus"]
      interval: 2s
      timeout: 2s
      retries: 15

