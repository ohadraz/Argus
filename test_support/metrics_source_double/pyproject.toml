[project]
name = "argus-metrics_source_double"
version = "0.1.0"
requires-python = ">=3.14"

# The ports it stands in for, whose values it answers in. Nothing else: it is
# held to those ports by their own suite, and anything it knew beyond them
# would be something no suite holds it to.
dependencies = [
    "argus-core",
    "argus-metrics_source",
]


[tool.uv.sources]
argus-core = { workspace = true }
argus-metrics_source = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/metrics_source_double"]
