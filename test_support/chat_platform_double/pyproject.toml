[project]
name = "argus-chat_platform_double"
version = "0.1.0"
requires-python = ">=3.14"

# The ports it stands in for, whose values it answers in, and the kernel those
# values are built from. Nothing else: it is held to the ports by their own
# suite, and anything it knew beyond them would be something no suite holds it
# to.
dependencies = [
    "argus-core",
    "argus-chat_platform",
]


[tool.uv.sources]
argus-core = { workspace = true }
argus-chat_platform = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/chat_platform_double"]
