[project]
name = "argus-workspace"
version = "0.0.1"
requires-python = ">=3.14"


[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "pytest-cov",
    # Splits a suite across runners: `--splits N --group i` selects one share of
    # the tests. CI shards `e2e_replay` with it, because that suite is one long
    # walk after another and a runner is cheaper than the wait.
    "pytest-split",
    "ruff",
    "mypy",
    "nox",
    "pre-commit",
    "httpx2",
    "psycopg[binary]",
    # Suspends and resumes the stack's worker, for an e2e case that needs the
    # walk not to have started yet. Cross-platform, which `SIGSTOP` is not.
    "psutil",
    "types-psutil",
    "argus-argus_testkit",
    "argus-anthropic_double",
    "import-linter>=2.15",
    # The import graph with third parties in it, which `scripts/guard_layering.py`
    # builds for the one rule import-linter cannot hold. It arrives with
    # import-linter already; named because the script imports it.
    "grimp",
]


[tool.uv.sources]
argus-argus_testkit = { workspace = true }
argus-anthropic_double = { workspace = true }


# uv
[tool.uv]
package = false

# No `no-binary-package` here, and that is a decision rather than an omission.
# `mypy` and its `librt` are both shipped as compiled wheels, and Windows Smart
# App Control takes no issue with either: what it judges is a binary built on
# this machine, and a wheel downloaded from PyPI is not one. Naming a package
# here says "never take the wheel", which for these two means "compile it here
# instead" - and that is what produces the file SAC then blocks, on a machine
# where the published one imports without complaint. See the
# `smart-app-control-blocks` skill for the shapes that block and the fixes that
# apply to each.

[tool.uv.workspace]
# `test_support/` holds what the suites run on and nothing ships: the testkit and
# the doubles. Members all the same, because a double is a process the stack
# starts and the testkit a dev dependency - and apart, so that which modules
# ship, and which are Claude's to edit, is said by where they live.
members = ["modules/*", "test_support/*"]


# ruff (linter and code formatter)
[tool.ruff]
line-length = 100
target-version = "py314"

# linter config
[tool.ruff.lint]
select = [
    "E",   # pycodestyle Errors (basic style: spacing, indentation)
    "F",   # pyFlakes (real bugs: unused imports, undefined names)
    "I",   # Isort (import statement ordering/grouping)
    "UP",  # pyUPgrade (flags old-style syntax and suggests newer Python features)
    "B",   # flake8-Bugbear (common bug-prone patterns)
    "SIM"  # flake8-SIMplify (flags code that could be written more simply)
]


# mypy (static type checker)
[tool.mypy]
strict = true
# Checks the keys and values of `model_copy(update={...})` against the model,
# which pydantic itself never does - see the plugin's own docstring.
plugins = ["scripts/mypy_model_copy.py"]


# pytest config
[tool.pytest.ini_options]
pythonpath = ["."]
# LangSmith ships a pytest plugin that pytest auto-loads, and nothing here uses
# it: it arrives as a transitive dependency of LangGraph. Loading it imports
# `xxhash`, whose published `cp314-win_amd64` wheel Smart App Control began
# refusing on this machine mid-session, which fails collection of every suite
# before a single test runs. Disabling the plugin is not a workaround for the
# block - it declines to import a plugin the suite never wanted, and the wheel is
# untouched. See the `smart-app-control-blocks` skill for why there is no
# install-side fix to reach for instead.
addopts = "-p no:langsmith_plugin"
markers = [
    "unit: one function or class, its collaborators doubled where it delegates",
    "component: one module entire, through its own front door, every collaborator real - Fowler's sociable test, whatever infrastructure it needs behind it",
    "integration: the code that talks to an external system, exercised against a live one - a repository against postgres, a client against its server",
    "e2e: full stack, hits docker-compose services",
    "contract: the double still matches the third party it stands in for",
    "eval: hits the real Anthropic API and judges the answer, not the plumbing",
]


# import-linter (the layering, enforced rather than described)
#
# The arrow at the bottom of this system points one way: the kernel knows
# nothing about anybody, the incident record knows only the kernel, and the page
# knows only what it reads from. That claim has been written in `CLAUDE.md` since
# before it was true - `incident_record` declared a dependency on an agent for
# months, which is precisely the failure a documented invariant nobody checks
# produces. These contracts are the check.
#
# The fourth says how the kernel is addressed rather than who may depend on it.
# An empty `__init__.py` declares no surface, so twenty modules reached in by
# module path and nothing in the kernel marked what was stable. The front doors
# are now stated, and everything else under `core` is internal by default.
#
# `forbidden_modules = ["*"]` rather than a deny-list naming every other package.
# A list would be a nineteenth module's free pass: absent from all three
# contracts, importing whatever it likes, in the one file whose job is catching a
# drift nobody noticed. The exceptions are stated instead - `ignore_imports` is
# the whole of what each layer is permitted to know - so a new module is covered
# on the day it exists and a new *allowance* is a line somebody had to write.
#
# `root_packages` is still a list, because import-linter takes no wildcard there.
# `scripts/guard_layering.py` asserts it names every module under `modules/`: one
# missing is not analyzed at all, and a contract that cannot see a package cannot
# be broken by it.
[tool.importlinter]
root_packages = [
    "alert_source",
    "alerting_platform",
    "apps",
    "chat_platform",
    "code_host",
    "codefix_agent",
    "communication",
    "core",
    "deployment_platform",
    "embedding_fastembed",
    "exchange_rate_source",
    "executive_synopsis",
    "flag_provider",
    "http_applying",
    "incident_cost",
    "incident_memory",
    "incident_record",
    "investigation_agent",
    "llm_anthropic",
    "mcp_transport",
    "message_intent",
    "metrics_source",
    "mitigation",
    "narration",
    "oncall_source",
    "orchestrator",
    "pay_band_source",
    "postgres",
    "postmortem_rendering",
    "postmortem_writing",
    "push_source",
    "read_mcp_client",
    "read_mcp_server",
    "repository_index",
    "revenue_source",
    "telemetry",
    "vector_store_qdrant",
    "web_app",
    "write_mcp_client",
    "write_mcp_server",
]

# No import cycle inside any package: at every level of every package, the
# siblings beneath it import one another in one direction only. Inside a package
# and nowhere else - two top-level packages share no ancestor to be compared
# under, so a cycle between packages is outside this contract. Annotation-only
# imports count - a type kept where its users' own dependants live is a cycle
# that merely has not run yet, and one that did run hid behind whichever module
# a caller imported first. `*` rather than a list, so a module added tomorrow is
# held to it too.
[[tool.importlinter.contracts]]
name = "no package's modules import one another in a circle"
type = "acyclic_siblings"
ancestors = ["*"]

[[tool.importlinter.contracts]]
name = "core is the kernel and depends on nothing in this workspace"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["*"]

[[tool.importlinter.contracts]]
name = "http_applying depends on nothing in this workspace"
type = "forbidden"
source_modules = ["http_applying"]
forbidden_modules = ["*"]

[[tool.importlinter.contracts]]
name = "incident_cost depends on nothing in this workspace"
type = "forbidden"
source_modules = ["incident_cost"]
forbidden_modules = ["*"]
# What an incident cost is money and arithmetic, and whoever writes about it -
# the postmortem, the walk that gathers its sources - takes this. A cost that
# reached an agent or the incident record would install it wherever money is
# counted, and the reads it costs from arrive as ports for the same reason. The
# kernel is the one package it may come to need, and today it names none of
# it: the day it does, the allowance is a line written here, as the
# `incident_record` contract below writes its own.

[[tool.importlinter.contracts]]
name = "incident_record knows only the kernel and the database"
type = "forbidden"
source_modules = ["incident_record"]
forbidden_modules = ["*"]
ignore_imports = [
    "incident_record.** -> core",
    "incident_record.** -> core.**",
    "incident_record.** -> postgres",
]
# A layer that stops importing something it was allowed to import is not a
# failure, and an allowance is written for a package rather than for whichever
# of its modules happens to be reached today - so an exception that matches
# nothing says so and does not stop the build.
unmatched_ignore_imports_alerting = "warn"

[[tool.importlinter.contracts]]
name = "chat_platform is the chat platform's port and adapter and knows only the kernel"
type = "forbidden"
source_modules = ["chat_platform"]
forbidden_modules = ["*"]
# `web_app` serves the endpoints the platform delivers to, so whatever this
# imports the web process installs. A port that reached into the incident
# record or an agent would be a port that decided something, where its job is
# to say what the platform said.
ignore_imports = [
    "chat_platform.** -> core",
    "chat_platform.** -> core.**",
]
unmatched_ignore_imports_alerting = "warn"

[[tool.importlinter.contracts]]
name = "telemetry installs the SDK and knows only the kernel"
type = "forbidden"
source_modules = ["telemetry"]
forbidden_modules = ["*"]
# Every process's root reaches this, the web process's included, so whatever
# it imports every process installs. The kernel, for the settings slice it is
# handed, the base Langfuse's settings are declared on (`AdapterSettings`) and
# the names telemetry is spelled in - the keys a log record is stamped with are
# the ones the spans carry - and nothing else.
ignore_imports = [
    "telemetry.** -> core",
    "telemetry.** -> core.telemetry",
]
unmatched_ignore_imports_alerting = "warn"

[[tool.importlinter.contracts]]
name = "the kernel is reached through its front doors, not by module path"
type = "forbidden"
source_modules = ["*"]
forbidden_modules = ["core.**"]
# Direct imports only. Without this the contract would fail on every chain that
# merely passes through the kernel - a caller reaching `core.events`,
# which reaches `core.models.reading` - and would be a rule about what the
# kernel does internally rather than about how it is addressed from outside.
allow_indirect_imports = true
# The front doors, and the whole of what may be named. Everything else under
# `core` is internal by default, so a module added to the kernel tomorrow
# is unreachable by path on the day it exists, and making it public is a line
# somebody had to write here.
#
# The kernel reaching into itself is the first allowance: `events` names
# `models.reading`, and a package that had to go through its own front door
# would import itself while still importing.
#
# Some doors are narrower than the rest: the allowance names the modules that
# may go through it, and reaching past it is a broken contract here. The
# autonomy policy, at the end of the list, is the one.
ignore_imports = [
    "core.** -> core.**",
    "** -> core.models",
    "** -> core.events",
    "** -> core.replay",
    "** -> core.anomaly",
    # The names telemetry is spelled in. A door for everyone, because every
    # process opens spans - the walk names the incident on its, the servers
    # the tool on theirs - and a name spelled twice is a name that drifts.
    "** -> core.telemetry",
    # What bounds an agent loop, reached by both agents that keep one. A
    # door rather than a shared module by accident: the bounds moved here
    # when Code-Fix came to need the same three, and an agent reaching
    # into the other for them is the import this whole contract exists to
    # refuse.
    "** -> core.budget",
    "** -> core.source_scope",
    # The embedder's port, and a door for everyone, like the vector store's: it
    # imports no third party, so naming it installs nothing. The model behind
    # it is `embedding_fastembed`'s, and only a process's root builds one.
    "** -> core.embedding",
    # The vector store's ports, and a door for everyone: they import no third
    # party, so naming one installs nothing. The walk types the store it holds
    # by it, the read server the store it searches, and the corpora the store
    # they write - and the vendor behind it is `vector_store_qdrant`'s alone.
    "** -> core.vector_store",
    # How a stored row is brought up to the shape it is read in, and what one
    # that cannot be read is said to be. A door for everyone: every package
    # that stores a model's dump - the incident record and the memory alike -
    # reads it back through this.
    "** -> core.stored",
    # The model's port, and a door for everyone, like the vector store's: the
    # client interface, the provider port, the factory and the conversations
    # import no third party, so naming them installs nothing.
    "** -> core.llm",
    # The autonomy policy (spec §13), and narrow for a reason of its own: the
    # walk asks it, and the Mitigator names the admission its
    # write accepts. Nobody else has any business with it. A door opens the
    # whole module, so this one would let the Mitigator call `admit` as well -
    # and `admit` judges reach by what its caller hands it. The layering script
    # holds that half: outside the walk, the worker's root and the kernel,
    # nothing names `admit`. The worker's root is here because it hands the
    # walk the policy's `admit` for the gate to ask, and it never calls it.
    "orchestrator.** -> core.autonomy",
    "mitigation.** -> core.autonomy",
    "apps.worker.** -> core.autonomy",
]
unmatched_ignore_imports_alerting = "warn"

[[tool.importlinter.contracts]]
name = "incident_memory holds records rather than reading the incident record"
type = "forbidden"
source_modules = ["incident_memory"]
forbidden_modules = ["*"]
# The kernel and nothing else - in particular not `incident_record`. What a
# past incident tried is composed from actions handed to it, the way
# `narration` renders events handed to it: the walk already holds a
# repository, and a second module opening its own connection to the same rows
# would put the question of which incident's actions these are in two places.
# The rows this module does own - the records filed for memory - are its own
# table, written and read here.
#
# By module path: every side of it reaches the kernel through doors -
# `core.models`, `core.embedding` - and never names it bare. The deliverer's
# process, which does, is its root's (`apps.deliverer`).
ignore_imports = [
    "incident_memory.** -> core.**",
]
unmatched_ignore_imports_alerting = "warn"

[[tool.importlinter.contracts]]
name = "the walk writes to no store the fence cannot reach"
type = "forbidden"
# The packages that walk an incident: the Orchestrator and the four agents it
# delegates to inside a walk, the executive synopsis written from the
# postmortem, the costing the postmortem reads its money through, and the
# worker's root, which builds what they are handed. Every write they make is
# made for the run their process holds, and the fence refuses it once a newer
# claim holds that run - but only the database has a fence. A store outside it
# takes a write from a walk whose run was taken back as readily as from the
# one that holds it.
#
# So the walk writes long-term memory as a row, and the deliverer fills the
# store from the rows; it tells people through the event log the relay reads,
# and never by posting. What is forbidden here is the half import-linter can
# see: the store's writing side, the deliverer, and the chat platform's port.
# The other half - the vendors' SDKs - is held by `scripts/guard_layering.py`,
# which reads this contract's `source_modules` for the packages it holds to it:
# import-linter sees a third party only with `include_external_packages`, which
# is global and turns every `["*"]` contract above against the standard library.
source_modules = [
    "apps.worker",
    "codefix_agent",
    "executive_synopsis",
    "incident_cost",
    "investigation_agent",
    "mitigation",
    "orchestrator",
    "postmortem_writing",
]
forbidden_modules = [
    "chat_platform",
    "incident_memory.delivering",
    "incident_memory.keeping",
    "vector_store_qdrant.indexing",
]

[[tool.importlinter.contracts]]
name = "the write-up never knows its synopsis"
type = "forbidden"
# The synopsis is written from the stored postmortem, through the writer's
# figure engine and its judge, so `executive_synopsis` imports the writer. The
# other way round would be a cycle between the two, and a write-up that changed
# with the summary written of it.
source_modules = ["postmortem_writing"]
forbidden_modules = ["executive_synopsis"]

[[tool.importlinter.contracts]]
name = "postmortem_rendering says what a postmortem says from values it is handed"
type = "forbidden"
source_modules = ["postmortem_rendering"]
forbidden_modules = ["*"]
# The kernel and the narration, and nothing else. The page and the Communicator
# both read this, so whatever it imports both install: an agent here is one
# the web process may not have and the Communicator may not name, and the
# incident record here is a second module opening a connection to rows its
# caller has already read.
ignore_imports = [
    "postmortem_rendering.** -> core",
    "postmortem_rendering.** -> core.**",
    "postmortem_rendering.** -> narration",
]
unmatched_ignore_imports_alerting = "warn"

[[tool.importlinter.contracts]]
name = "web_app serves HTML without installing an agent"
type = "forbidden"
source_modules = ["web_app"]
forbidden_modules = ["*"]
# One line per allowance, in the form that layer actually uses: a package
# imported through its own front door is named bare, and one reached by module
# path is named with `.**`. A wildcard cannot replace part of a name, so listing
# both spellings of every allowance would warn about the unused half on every
# run - and a build that always prints warnings is a build nobody reads.
ignore_imports = [
    "web_app.** -> core",
    "web_app.** -> core.**",
    "web_app.** -> postgres",
    "web_app.** -> incident_record",
    "web_app.** -> incident_record.**",
    "web_app.** -> narration",
    "web_app.** -> postmortem_rendering",
    # The watermark, and nothing else of the index. `repository_index.records` is
    # Postgres alone - one row saying where the repository is - where
    # `repository_index.store` writes passages to a vector store. Named by module
    # rather than as a package so that the day somebody reaches for the other
    # half, the contract says so instead of this process quietly growing a
    # store to serve a page.
    "web_app.** -> repository_index.records",
    # The ports a person's resolution, a person's words in an incident's thread
    # and their press of an offer, an alert and a push arrive through. Their
    # adapters are the web process's root's to build (`apps.web`).
    "web_app.** -> oncall_source",
    "web_app.** -> oncall_source.platform",
    "web_app.** -> chat_platform",
    "web_app.** -> alert_source",
    "web_app.** -> push_source",
]
unmatched_ignore_imports_alerting = "warn"

[[tool.importlinter.contracts]]
name = "the senders' ports and adapters know only the kernel"
type = "forbidden"
source_modules = ["alert_source", "push_source"]
forbidden_modules = ["*"]
# `web_app` hears every sender, so whatever these import the web process
# installs - and a port that reached into the incident record or an agent would
# be a port that decided something, where its job is to say what the sender
# said. The alert's model, which is what an alert source answers in; a push
# source answers in values of its own, and its GitHub adapter declares its
# settings on the kernel's base for an adapter's.
ignore_imports = [
    "alert_source.** -> core.models",
    "push_source.github -> core",
]
unmatched_ignore_imports_alerting = "warn"

[[tool.importlinter.contracts]]
name = "a process's root, in apps, is the only importer of an adapter, of telemetry, and of a root"
type = "protected"
# Ports and Adapters holds only if exactly one place per process chooses the
# adapters. That place is the process's root - `apps.<process>`, which starts
# it - and nothing else may name what a root chooses: each vendor's adapter,
# the telemetry SDK a process installs, and the roots themselves. So every
# library is handed its vendors as ports, and swapping a vendor is an edit to
# the roots of the processes that use it and to nothing else.
#
# One list of what is chosen, rather than an allowance per process per
# adapter: a process that comes to build an adapter needs no line here, and a
# library that reaches for one is refused whoever it is. An adapter added
# tomorrow is a line in `protected_modules` - which is where a vendor's arrival
# should be seen.
#
# `as_packages` (the default) lets a protected package's own modules reach
# each other. The ignores below are the adapters whose modules sit beside
# their port rather than under a package of their own: each is an adapter's
# own halves, not a process's allowance.
protected_modules = [
    "alert_source.grafana",
    "alerting_platform.grafana",
    "apps",
    "chat_platform.slack",
    "chat_platform.slack_deliveries",
    "chat_platform.slack_posting",
    "code_host.github",
    "deployment_platform.argocd",
    "embedding_fastembed",
    "exchange_rate_source.frankfurter",
    "flag_provider.unleash",
    "llm_anthropic",
    "metrics_source.prometheus_adapter",
    "metrics_source.prometheus_settings",
    "metrics_source.prometheus_units",
    "oncall_source.pagerduty_adapter",
    "oncall_source.pagerduty_settings",
    "oncall_source.pagerduty_webhooks",
    "pay_band_source.bamboohr_adapter",
    "pay_band_source.bamboohr_settings",
    "push_source.github",
    "revenue_source.stripe_adapter",
    "revenue_source.stripe_settings",
    "telemetry",
    "vector_store_qdrant",
]
allowed_importers = ["apps"]
ignore_imports = [
    "chat_platform.slack -> chat_platform.slack_deliveries",
    "chat_platform.slack -> chat_platform.slack_posting",
    "chat_platform.slack_posting -> chat_platform.slack_deliveries",
    "metrics_source.prometheus_adapter -> metrics_source.prometheus_settings",
    "metrics_source.prometheus_adapter -> metrics_source.prometheus_units",
    "oncall_source.pagerduty_adapter -> oncall_source.pagerduty_settings",
    "oncall_source.pagerduty_adapter -> oncall_source.pagerduty_webhooks",
    "pay_band_source.bamboohr_adapter -> pay_band_source.bamboohr_settings",
    "revenue_source.stripe_adapter -> revenue_source.stripe_settings",
]

[[tool.importlinter.contracts]]
name = "only the deliverer's and the index's roots build the vector store's writing side"
type = "protected"
# The contract above lets any root name any adapter, and the read tier's root
# builds the store's reading side - so without this, `apps.read_mcp` could
# build the side that writes, and the read tier would hold a store it can
# change (§13). The two roots that fill a store, and nobody else. The walk's
# contract forbids the worker's root the same, for the fence's reason.
protected_modules = ["vector_store_qdrant.indexing"]
allowed_importers = ["apps.deliverer", "apps.indexer"]

[[tool.importlinter.contracts]]
name = "no process's root reaches another's"
type = "independence"
# Each root is one extra of `apps`, and installs what that extra names. A root
# that reached another - the web process's importing the worker's assembling -
# would run the other process's packages where they are not installed, and the
# script's check of each root against its extra reads direct imports alone. So
# no chain at all from one root to another; what two roots share belongs in a
# library either can import.
modules = [
    "apps.deliverer",
    "apps.indexer",
    "apps.intent_reader",
    "apps.read_mcp",
    "apps.relay",
    "apps.schema",
    "apps.web",
    "apps.worker",
    "apps.write_mcp",
]

[[tool.importlinter.contracts]]
name = "an agent knows the kernel and its own sources, never another agent"
type = "independence"
# The five delegates of the multi-agent system, and the Intent Reader, which no walk
# delegates to but which is a part of Argus all the same. What they share is the
# kernel and the incident record, and anything two of them both need belongs
# there - which is the rule `CLAUDE.md` has stated all along and nothing
# enforced, so the first agent-to-agent edge arrived and no build failed. A
# human found it in review.
#
# `orchestrator` is deliberately absent rather than exempted. It is the thing
# that delegates: importing all five is its whole job, and a contract naming it
# would either be broken on the day it was written or would need an allowance
# per agent, which is a list saying "except for the one case this is about".
modules = [
    "codefix_agent",
    "communication",
    "investigation_agent",
    "message_intent",
    "mitigation",
    "postmortem_writing",
]
