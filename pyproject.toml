[project]
name = "argus-workspace"
version = "0.0.1"
requires-python = ">=3.14"


[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "pytest-cov",
    # Splits a suite across runners: `--splits N --group i` selects one share of
    # the tests. CI shards `e2e_replay` with it, because that suite is one long
    # walk after another and a runner is cheaper than the wait.
    "pytest-split",
    "ruff",
    "mypy",
    "nox",
    "pre-commit",
    "httpx",
    "psycopg[binary]",
    "argus-argus_testkit",
    "argus-anthropic_double",
    "import-linter>=2.15",
]


[tool.uv.sources]
argus-argus_testkit = { workspace = true }
argus-anthropic_double = { workspace = true }


# uv
[tool.uv]
package = false

# No `no-binary-package` here, and that is a decision rather than an omission.
# `mypy` and its `librt` are both shipped as compiled wheels, and Windows Smart
# App Control takes no issue with either: what it judges is a binary built on
# this machine, and a wheel downloaded from PyPI is not one. Naming a package
# here says "never take the wheel", which for these two means "compile it here
# instead" - and that is what produces the file SAC then blocks, on a machine
# where the published one imports without complaint. See the
# `smart-app-control-blocks` skill for the shapes that block and the fixes that
# apply to each.

[tool.uv.workspace]
members = ["modules/*"]


# ruff (linter and code formatter)
[tool.ruff]
line-length = 100
target-version = "py314"

# linter config
[tool.ruff.lint]
select = [
    "E",   # pycodestyle Errors (basic style: spacing, indentation)
    "F",   # pyFlakes (real bugs: unused imports, undefined names)
    "I",   # Isort (import statement ordering/grouping)
    "UP",  # pyUPgrade (flags old-style syntax and suggests newer Python features)
    "B",   # flake8-Bugbear (common bug-prone patterns)
    "SIM"  # flake8-SIMplify (flags code that could be written more simply)
]


# mypy (static type checker)
[tool.mypy]
strict = true


# pytest config
[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "unit: one function or class, its collaborators doubled where it delegates",
    "component: one module entire, through its own front door, every collaborator real - Fowler's sociable test, whatever infrastructure it needs behind it",
    "integration: the code that talks to an external system, exercised against a live one - a repository against postgres, a client against its server",
    "e2e: full stack, hits docker-compose services",
    "contract: the double still matches the third party it stands in for",
    "eval: hits the real Anthropic API and judges the answer, not the plumbing",
]


# import-linter (the layering, enforced rather than described)
#
# The arrow at the bottom of this system points one way: the kernel knows
# nothing about anybody, the incident record knows only the kernel, and the page
# knows only what it reads from. That claim has been written in `CLAUDE.md` since
# before it was true - `argus_incidents` declared a dependency on an agent for
# months, which is precisely the failure a documented invariant nobody checks
# produces. These contracts are the check.
#
# The fourth says how the kernel is addressed rather than who may depend on it.
# An empty `__init__.py` declares no surface, so twenty modules reached in by
# module path and nothing in the kernel marked what was stable. The front doors
# are now stated, and everything else under `argus_core` is internal by default.
#
# `forbidden_modules = ["*"]` rather than a deny-list naming every other package.
# A list would be a nineteenth module's free pass: absent from all three
# contracts, importing whatever it likes, in the one file whose job is catching a
# drift nobody noticed. The exceptions are stated instead - `ignore_imports` is
# the whole of what each layer is permitted to know - so a new module is covered
# on the day it exists and a new *allowance* is a line somebody had to write.
#
# `root_packages` is still a list, because import-linter takes no wildcard there.
# `scripts/guard_layering.py` asserts it names every module under `modules/`: one
# missing is not analyzed at all, and a contract that cannot see a package cannot
# be broken by it.
[tool.importlinter]
root_packages = [
    "agent_codefix",
    "agent_communicator",
    "agent_investigator",
    "agent_mitigation",
    "agent_postmortem",
    "argus_core",
    "argus_incidents",
    "argus_narration",
    "argus_web",
    "code_index",
    "exchange_rate_source",
    "incident_memory",
    "oncall_source",
    "orchestrator",
    "read_mcp_client",
    "read_mcp_server",
    "repository_source",
    "responder_rate_source",
    "revenue_source",
    "write_mcp_client",
    "write_mcp_server",
]

[[tool.importlinter.contracts]]
name = "argus_core is the kernel and depends on nothing in this workspace"
type = "forbidden"
source_modules = ["argus_core"]
forbidden_modules = ["*"]

[[tool.importlinter.contracts]]
name = "argus_incidents is the incident record and knows only the kernel"
type = "forbidden"
source_modules = ["argus_incidents"]
forbidden_modules = ["*"]
ignore_imports = [
    "argus_incidents.** -> argus_core",
    "argus_incidents.** -> argus_core.**",
]
# A layer that stops importing something it was allowed to import is not a
# failure, and an allowance is written for a package rather than for whichever
# of its modules happens to be reached today - so an exception that matches
# nothing says so and does not stop the build.
unmatched_ignore_imports_alerting = "warn"

[[tool.importlinter.contracts]]
name = "the kernel is reached through its front doors, not by module path"
type = "forbidden"
source_modules = ["*"]
forbidden_modules = ["argus_core.**"]
# Direct imports only. Without this the contract would fail on every chain that
# merely passes through the kernel - a caller reaching `argus_core.events`,
# which reaches `argus_core.models.reading` - and would be a rule about what the
# kernel does internally rather than about how it is addressed from outside.
allow_indirect_imports = true
# The front doors, and the whole of what may be named. Everything else under
# `argus_core` is internal by default, so a module added to the kernel tomorrow
# is unreachable by path on the day it exists, and making it public is a line
# somebody had to write here.
#
# The kernel reaching into itself is the first allowance: `events` names
# `models.reading`, and a package that had to go through its own front door
# would import itself while still importing.
#
# Two of the doors are narrower than the rest, and that is the other half of
# `argus_core`'s extras. `anthropic` and `mcp` are optional dependencies, taken
# by the modules that go through `argus_core.llm` and `argus_core.mcp_transport`
# and by nobody else. A module reaching one without declaring the extra would
# work in the workspace venv and fail wherever that module is resolved on its
# own - so the allowance names the modules, and reaching past it is a broken
# contract here rather than an ImportError in a walk.
ignore_imports = [
    "argus_core.** -> argus_core.**",
    "** -> argus_core.models",
    "** -> argus_core.events",
    "** -> argus_core.replay",
    "** -> argus_core.schema",
    "** -> argus_core.anomaly",
    "** -> argus_core.source_scope",
    # Narrower than the doors above it, and for the reason `llm` and
    # `mcp_transport` are narrow: `embedding` is an optional dependency, taken
    # by the two modules that hold a corpus and by nobody else. A module
    # reaching it without declaring the extra would work in the workspace venv
    # and fail wherever that module is resolved on its own.
    "code_index.** -> argus_core.embedding",
    "incident_memory.** -> argus_core.embedding",
    # The walk is the third, and reaches it for a different reason than the two
    # above: it holds no corpus of its own, it builds the model long-term memory
    # is written and searched with. It already declares the extra, through
    # `argus-incident_memory[store]`.
    "orchestrator.** -> argus_core.embedding",
    # The store beside the model, and narrow for the same reason: the two
    # modules that keep a corpus, and nobody else. The walk is not among
    # them - it builds the embedder, and the collection is made by whoever
    # writes into one.
    "code_index.** -> argus_core.vector_store",
    "incident_memory.** -> argus_core.vector_store",
    "agent_codefix.** -> argus_core.llm",
    "agent_investigator.** -> argus_core.llm",
    "agent_postmortem.** -> argus_core.llm",
    "orchestrator.** -> argus_core.llm",
    "agent_codefix.** -> argus_core.mcp_transport",
    "agent_investigator.** -> argus_core.mcp_transport",
    "agent_mitigation.** -> argus_core.mcp_transport",
    "orchestrator.** -> argus_core.mcp_transport",
    "read_mcp_client.** -> argus_core.mcp_transport",
    "write_mcp_client.** -> argus_core.mcp_transport",
]
unmatched_ignore_imports_alerting = "warn"

[[tool.importlinter.contracts]]
name = "incident_memory holds records rather than reading the incident record"
type = "forbidden"
source_modules = ["incident_memory"]
forbidden_modules = ["*"]
# The kernel and nothing else - in particular not `argus_incidents`. What a
# past incident tried is composed from actions handed to it, the way
# `argus_narration` renders events handed to it: the walk already holds a
# repository, and a second module opening its own connection to the same rows
# would put the question of which incident's actions these are in two places.
#
# By module path alone, and that is not an oversight: nothing here names
# `argus_core` bare. It reaches `argus_core.models` and `argus_core.embedding`,
# both of which are doors, and an allowance matching nothing warns on every run
# until somebody removes it.
ignore_imports = [
    "incident_memory.** -> argus_core.**",
]
unmatched_ignore_imports_alerting = "warn"

[[tool.importlinter.contracts]]
name = "argus_web serves HTML without installing an agent"
type = "forbidden"
source_modules = ["argus_web"]
forbidden_modules = ["*"]
# One line per allowance, in the form that layer actually uses: a package
# imported through its own front door is named bare, and one reached by module
# path is named with `.**`. A wildcard cannot replace part of a name, so listing
# both spellings of every allowance would warn about the unused half on every
# run - and a build that always prints warnings is a build nobody reads.
ignore_imports = [
    "argus_web.** -> argus_core",
    "argus_web.** -> argus_core.**",
    "argus_web.** -> argus_incidents",
    "argus_web.** -> argus_incidents.**",
    "argus_web.** -> argus_narration",
    # The watermark, and nothing else of the index. `code_index.records` is
    # Postgres alone - one row saying where the repository is - where
    # `code_index.store` and `code_index.embedding` are a vector store and an
    # ONNX runtime. Named by module rather than as a package so that the day
    # somebody reaches for the other half, the contract says so instead of
    # this process quietly growing an embedding model to serve a page.
    "argus_web.** -> code_index.records",
]
unmatched_ignore_imports_alerting = "warn"

[[tool.importlinter.contracts]]
name = "an agent knows the kernel and its own sources, never another agent"
type = "independence"
# The five delegates of the multi-agent system. What they share is the kernel,
# and anything two of them both need belongs there - which is the rule
# `CLAUDE.md` has stated all along and nothing enforced, so the first
# agent-to-agent edge arrived and no build failed. A human found it in review.
#
# `orchestrator` is deliberately absent rather than exempted. It is the thing
# that delegates: importing all five is its whole job, and a contract naming it
# would either be broken on the day it was written or would need an allowance
# per agent, which is a list saying "except for the one case this is about".
modules = [
    "agent_codefix",
    "agent_communicator",
    "agent_investigator",
    "agent_mitigation",
    "agent_postmortem",
]
