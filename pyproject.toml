[project]
name = "argus-workspace"
version = "0.0.1"
requires-python = ">=3.14"


[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "pytest-cov",
    # Splits a suite across runners: `--splits N --group i` selects one share of
    # the tests. CI shards `e2e_replay` with it, because that suite is one long
    # walk after another and a runner is cheaper than the wait.
    "pytest-split",
    "ruff",
    "mypy",
    "nox",
    "pre-commit",
    "httpx",
    "psycopg[binary]",
    "argus-argus_testkit",
    "argus-anthropic_double",
    "import-linter>=2.15",
]


[tool.uv.sources]
argus-argus_testkit = { workspace = true }
argus-anthropic_double = { workspace = true }


# uv
[tool.uv]
package = false

# mypy is shipped as a fully compiled wheel - every module a `.pyd` built by
# mypyc, plus a `__mypyc` extension they all link against. Windows Smart App
# Control blocks those locally-installed binaries, and `python -m mypy` does not
# help the way it helps with a console-script shim: the block is inside the
# package, not on a wrapper around it, so the import fails before mypy runs at
# all (`mypy --version` fails too).
#
# Building from the sdist instead gives the pure-Python mypy, which is the same
# type checker and several times slower. Slower type checking is a better trade
# than none, and this is the whole fix - it survives `uv sync`, where clearing
# the block by hand does not.
#
# `librt` is here for the same reason and by the same mechanism. mypy 2.x moved
# part of its build machinery into that separate package, which ships compiled
# too - so a pure-Python mypy still imports a blocked `.pyd` and fails
# identically, one line further down the traceback.
no-binary-package = ["mypy", "librt"]

[tool.uv.workspace]
members = ["modules/*"]


# ruff (linter and code formatter)
[tool.ruff]
line-length = 100
target-version = "py314"

# linter config
[tool.ruff.lint]
select = [
    "E",   # pycodestyle Errors (basic style: spacing, indentation)
    "F",   # pyFlakes (real bugs: unused imports, undefined names)
    "I",   # Isort (import statement ordering/grouping)
    "UP",  # pyUPgrade (flags old-style syntax and suggests newer Python features)
    "B",   # flake8-Bugbear (common bug-prone patterns)
    "SIM"  # flake8-SIMplify (flags code that could be written more simply)
]


# mypy (static type checker)
[tool.mypy]
strict = true


# pytest config
[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "unit: one function or class, its collaborators doubled where it delegates",
    "component: one module entire, through its own front door, every collaborator real - Fowler's sociable test, whatever infrastructure it needs behind it",
    "integration: the code that talks to an external system, exercised against a live one - a repository against postgres, a client against its server",
    "e2e: full stack, hits docker-compose services",
    "contract: the double still matches the third party it stands in for",
    "eval: hits the real Anthropic API and judges the answer, not the plumbing",
]


# import-linter (the layering, enforced rather than described)
#
# The arrow at the bottom of this system points one way: the kernel knows
# nothing about anybody, the incident record knows only the kernel, and the page
# knows only what it reads from. That claim has been written in `CLAUDE.md` since
# before it was true - `argus_incidents` declared a dependency on an agent for
# months, which is precisely the failure a documented invariant nobody checks
# produces. These contracts are the check.
#
# `forbidden_modules = ["*"]` rather than a deny-list naming every other package.
# A list would be a nineteenth module's free pass: absent from all three
# contracts, importing whatever it likes, in the one file whose job is catching a
# drift nobody noticed. The exceptions are stated instead - `ignore_imports` is
# the whole of what each layer is permitted to know - so a new module is covered
# on the day it exists and a new *allowance* is a line somebody had to write.
#
# `root_packages` is still a list, because import-linter takes no wildcard there.
# `scripts/guard_layering.py` asserts it names every module under `modules/`: one
# missing is not analyzed at all, and a contract that cannot see a package cannot
# be broken by it.
[tool.importlinter]
root_packages = [
    "agent_codefix",
    "agent_communicator",
    "agent_investigator",
    "agent_mitigation",
    "agent_postmortem",
    "argus_core",
    "argus_incidents",
    "argus_narration",
    "argus_web",
    "exchange_rate_source",
    "oncall_source",
    "orchestrator",
    "read_mcp_client",
    "read_mcp_server",
    "responder_rate_source",
    "revenue_source",
    "write_mcp_client",
    "write_mcp_server",
]

[[tool.importlinter.contracts]]
name = "argus_core is the kernel and depends on nothing in this workspace"
type = "forbidden"
source_modules = ["argus_core"]
forbidden_modules = ["*"]

[[tool.importlinter.contracts]]
name = "argus_incidents is the incident record and knows only the kernel"
type = "forbidden"
source_modules = ["argus_incidents"]
forbidden_modules = ["*"]
ignore_imports = ["argus_incidents.** -> argus_core.**"]
# A layer that stops importing something it was allowed to import is not a
# failure, and an allowance is written for a package rather than for whichever
# of its modules happens to be reached today - so an exception that matches
# nothing says so and does not stop the build.
unmatched_ignore_imports_alerting = "warn"

[[tool.importlinter.contracts]]
name = "argus_web serves HTML without installing an agent"
type = "forbidden"
source_modules = ["argus_web"]
forbidden_modules = ["*"]
# One line per allowance, in the form that layer actually uses: a package
# imported through its own front door is named bare, and one reached by module
# path is named with `.**`. A wildcard cannot replace part of a name, so listing
# both spellings of every allowance would warn about the unused half on every
# run - and a build that always prints warnings is a build nobody reads.
ignore_imports = [
    "argus_web.** -> argus_core.**",
    "argus_web.** -> argus_incidents.**",
    "argus_web.** -> argus_narration",
]
unmatched_ignore_imports_alerting = "warn"
