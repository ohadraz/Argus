; What `alembic` on the command line needs to find the chain - writing a
; revision, reading history, emitting SQL. The job itself does not read this
; file: it builds the same configuration in `argus_core.schema`, from the
; package's own location, so that a deployment that never checked this repo out
; still has its migrations.
;
; No connection string. `env.py` takes the database from `Settings`, which is
; where every other process takes it from - a URL here would be a second one to
; keep in step, and the first to go stale.

[alembic]
script_location = modules/argus_core/src/argus_core/migrations
prepend_sys_path = .
